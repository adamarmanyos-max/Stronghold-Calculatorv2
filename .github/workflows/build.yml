name: Build Stronghold Finder jar

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the project source
        run: |
          set -e
          cat > LICENSE <<'SFEOF'
          MIT License

          Copyright (c) 2026 Adam Armanyos

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          SFEOF
          cat > build.gradle <<'SFEOF'
          plugins {
              id 'fabric-loom' version '0.12-SNAPSHOT'
          }

          archivesBaseName = project.archives_base_name
          version = project.mod_version
          group = project.maven_group

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

              // No Fabric API. The mod only needs Loader + Mixin, both of which are
              // provided by fabric-loader itself.
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              // Java 17 bytecode -> class file major version 61.
              it.options.release = 17
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          SFEOF
          cat > gradle.properties <<'SFEOF'
          org.gradle.jvmargs=-Xmx2G

          # Minecraft / Fabric
          minecraft_version=1.16.1
          yarn_mappings=1.16.1+build.21
          loader_version=0.14.24

          # Mod
          mod_version=2.4.0
          maven_group=com.adamarmanyos
          archives_base_name=stronghold-finder
          SFEOF
          cat > settings.gradle <<'SFEOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'stronghold-finder'
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold
          cat > src/main/java/com/adamarmanyos/stronghold/StrongholdConfig.java <<'SFEOF'
          package com.adamarmanyos.stronghold;

          import java.io.BufferedReader;
          import java.io.BufferedWriter;
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          import net.fabricmc.loader.api.FabricLoader;

          /**
           * Tiny persisted config. Currently just HUD opacity.
           *
           * FabricLoader supplies the config directory, so this needs no Fabric API. The
           * file is a single "key=value" line per setting, written only when a value
           * actually changes.
           */
          public final class StrongholdConfig {

              private static final String FILE_NAME = "strongholdfinder.properties";

              /**
               * Minecraft's text renderer treats a colour with an alpha byte below 4 as
               * "no alpha given" and forces it fully opaque, so opacity can never go all
               * the way to invisible. 10% maps to alpha 26, comfortably above that.
               */
              public static final int MIN_OPACITY = 10;
              public static final int MAX_OPACITY = 100;
              public static final int OPACITY_STEP = 10;

              private static int opacityPercent = 100;
              private static boolean loaded;

              private StrongholdConfig() {
              }

              public static int opacityPercent() {
                  ensureLoaded();
                  return opacityPercent;
              }

              /** Alpha byte for the current opacity, ready to OR into an RGB colour. */
              public static int alphaBits() {
                  int alpha = (int) Math.round((opacityPercent() / 100.0D) * 255.0D);
                  if (alpha < 26) {
                      alpha = 26;
                  }
                  if (alpha > 255) {
                      alpha = 255;
                  }
                  return alpha << 24;
              }

              /** Applies the current opacity to a 0xRRGGBB colour. */
              public static int applyOpacity(int rgb) {
                  return alphaBits() | (rgb & 0x00FFFFFF);
              }

              /** @return the new opacity, clamped */
              public static int adjustOpacity(int deltaPercent) {
                  ensureLoaded();

                  int updated = opacityPercent + deltaPercent;
                  if (updated < MIN_OPACITY) {
                      updated = MIN_OPACITY;
                  }
                  if (updated > MAX_OPACITY) {
                      updated = MAX_OPACITY;
                  }

                  if (updated != opacityPercent) {
                      opacityPercent = updated;
                      save();
                  }
                  return opacityPercent;
              }

              private static synchronized void ensureLoaded() {
                  if (loaded) {
                      return;
                  }
                  loaded = true;

                  try {
                      Path path = configPath();
                      if (!Files.exists(path)) {
                          return;
                      }
                      BufferedReader reader = Files.newBufferedReader(path);
                      try {
                          String line;
                          while ((line = reader.readLine()) != null) {
                              int equals = line.indexOf('=');
                              if (equals <= 0) {
                                  continue;
                              }
                              String key = line.substring(0, equals).trim();
                              String value = line.substring(equals + 1).trim();
                              if ("opacity".equals(key)) {
                                  opacityPercent = clamp(Integer.parseInt(value));
                              }
                          }
                      } finally {
                          reader.close();
                      }
                  } catch (IOException failed) {
                      // Unreadable config is not worth crashing over; defaults stand.
                  } catch (NumberFormatException failed) {
                      opacityPercent = 100;
                  }
              }

              private static void save() {
                  try {
                      Path path = configPath();
                      Path parent = path.getParent();
                      if (parent != null) {
                          Files.createDirectories(parent);
                      }
                      BufferedWriter writer = Files.newBufferedWriter(path);
                      try {
                          writer.write("opacity=" + opacityPercent);
                          writer.newLine();
                      } finally {
                          writer.close();
                      }
                  } catch (IOException failed) {
                      // Setting still applies for this session even if it cannot persist.
                  }
              }

              private static int clamp(int value) {
                  if (value < MIN_OPACITY) {
                      return MIN_OPACITY;
                  }
                  if (value > MAX_OPACITY) {
                      return MAX_OPACITY;
                  }
                  return value;
              }

              private static Path configPath() {
                  return FabricLoader.getInstance().getConfigDir().resolve(FILE_NAME);
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold
          cat > src/main/java/com/adamarmanyos/stronghold/StrongholdFinderClient.java <<'SFEOF'
          package com.adamarmanyos.stronghold;

          import net.fabricmc.api.ClientModInitializer;

          /**
           * Entrypoint. There is intentionally nothing to do here: all behaviour is
           * driven from the HUD render injection, which avoids needing Fabric API's
           * tick/keybinding events.
           */
          public class StrongholdFinderClient implements ClientModInitializer {

              @Override
              public void onInitializeClient() {
                  System.out.println("[strongholdfinder] loaded, engine: " + StrongholdOverlay.calculatorName());
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold
          cat > src/main/java/com/adamarmanyos/stronghold/StrongholdOverlay.java <<'SFEOF'
          package com.adamarmanyos.stronghold;

          import java.util.ArrayList;
          import java.util.List;

          import com.adamarmanyos.stronghold.calc.EyeMeasurement;
          import com.adamarmanyos.stronghold.calc.RingStrongholdCalculator;
          import com.adamarmanyos.stronghold.calc.StrongholdCalculator;
          import com.adamarmanyos.stronghold.calc.StrongholdPrediction;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawableHelper;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.client.util.math.MatrixStack;

          import org.lwjgl.glfw.GLFW;

          /**
           * All mod state and rendering lives here. The mixin does nothing except call
           * {@link #render(MatrixStack)} once per frame, which keeps the mixin itself
           * trivial and means a mistake in this class can never break HUD injection.
           *
           * Everything runs on the render thread, so no synchronisation is needed and no
           * GLFW call is ever made off-thread.
           *
           * The panel layout deliberately mirrors Ninjabrain Bot's window: a title bar,
           * a candidate table with Chunk / % / Dist. / Nether columns, then an eye-throw
           * table with x / z / Angle / Error. It cannot match exactly - Minecraft only
           * offers its own bitmap font, and there is no way to draw rounded corners
           * cheaply - but the structure, columns and colour language are the same.
           */
          public final class StrongholdOverlay {

              // ------------------------------------------------------------------ keys

              private static final int KEY_MODIFIER = GLFW.GLFW_KEY_F3;
              private static final int KEY_CAPTURE = GLFW.GLFW_KEY_C;
              private static final int KEY_CALCULATE = GLFW.GLFW_KEY_N;
              private static final int KEY_RESET = GLFW.GLFW_KEY_B;
              private static final int KEY_FADE = GLFW.GLFW_KEY_LEFT_BRACKET;
              private static final int KEY_BRIGHTEN = GLFW.GLFW_KEY_RIGHT_BRACKET;

              // ---------------------------------------------------------------- layout

              private static final int PANEL_X = 4;
              private static final int PANEL_Y = 4;
              private static final int PANEL_WIDTH = 234;

              private static final int PADDING = 5;
              private static final int TITLE_BAR_HEIGHT = 14;
              private static final int ROW_HEIGHT = 11;

              // Column geometry, measured from the panel's left edge. These were checked
              // against Minecraft's font metrics for the widest values each column can
              // hold - a ring-3 stronghold at (-552, -552) chunk / (-1104, -1104) Nether,
              // 100.0% certainty, a five digit distance, and throw coordinates out to
              // -29999.99 - so nothing collides or spills past the panel edge.
              private static final int COL_CHUNK_CENTRE = 39;
              private static final int COL_PERCENT_RIGHT = 111;
              private static final int COL_DIST_RIGHT = 147;
              private static final int COL_NETHER_CENTRE = 191;

              // Eye-throw table columns.
              private static final int COL_THROW_X_RIGHT = 62;
              private static final int COL_THROW_Z_RIGHT = 124;
              private static final int COL_THROW_ANGLE_RIGHT = 176;
              private static final int COL_THROW_ERROR_RIGHT = 229;

              // ---------------------------------------------------------------- colours

              private static final int PANEL_BACKGROUND = 0x1C1F24;
              private static final int TITLE_BAR_BACKGROUND = 0x2C3138;
              private static final int SEPARATOR = 0x3A3F47;

              private static final int COLOR_TITLE = 0xF0F2F5;
              private static final int COLOR_VERSION = 0x7A828C;
              private static final int COLOR_HEADER = 0xB4BECC;
              private static final int COLOR_COORD = 0x8FA8C8;
              private static final int COLOR_NUMBER = 0xD8DCE2;
              private static final int COLOR_SECTION = 0xF0F2F5;

              private static final int COLOR_HIGH = 0x5BC46B;
              private static final int COLOR_MEDIUM = 0xE0A83C;
              private static final int COLOR_LOW = 0xC24A4A;

              private static final int COLOR_NOTICE = 0xFFD24A;

              // Certainty thresholds for the percentage colour, matching the reference
              // window where a strong candidate is green and near-zero ones are red.
              private static final double PERCENT_HIGH = 50.0D;
              private static final double PERCENT_MEDIUM = 5.0D;

              // Angle error thresholds in degrees, for the Error column colour.
              private static final double ERROR_GOOD = 0.01D;
              private static final double ERROR_FAIR = 0.05D;

              // ------------------------------------------------------------------ state

              private static final long NOTICE_DURATION_MS = 3000L;
              private static final int MAX_MEASUREMENTS = 2;

              private static final String VERSION = "v2.4.0";

              private static final StrongholdCalculator CALCULATOR = new RingStrongholdCalculator();

              private static final List<EyeMeasurement> MEASUREMENTS = new ArrayList<EyeMeasurement>();

              private static List<StrongholdPrediction> results;

              private static String notice;
              private static long noticeExpiresAt;

              // Previous key states, for rising-edge detection.
              private static boolean prevCapture;
              private static boolean prevCalculate;
              private static boolean prevReset;
              private static boolean prevFade;
              private static boolean prevBrighten;

              private StrongholdOverlay() {
              }

              public static void render(MatrixStack matrices) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client == null || client.player == null) {
                      return;
                  }

                  pollKeys(client);
                  draw(client, matrices);
              }

              // ----------------------------------------------------------------- input

              /**
               * Polls the raw key state each frame rather than hooking Minecraft's own
               * key handling. This is deliberate: F3+C is a vanilla debug combination
               * (copy position as a /tp command), and intercepting or cancelling it would
               * risk breaking that behaviour. Reading the key state alongside vanilla
               * leaves the vanilla action completely untouched.
               *
               * Note that holding F3+C down for several seconds is a vanilla "manual
               * crash" shortcut. Tap it; do not hold it.
               */
              private static void pollKeys(MinecraftClient client) {
                  if (client.currentScreen != null) {
                      // A screen is open (chat, inventory, menus). Ignore keys so typing
                      // letters in chat cannot trigger the mod.
                      prevCapture = false;
                      prevCalculate = false;
                      prevReset = false;
                      prevFade = false;
                      prevBrighten = false;
                      return;
                  }

                  long window = client.getWindow().getHandle();

                  boolean modifier = InputUtil.isKeyPressed(window, KEY_MODIFIER);
                  boolean capture = modifier && InputUtil.isKeyPressed(window, KEY_CAPTURE);
                  boolean calculate = !modifier && InputUtil.isKeyPressed(window, KEY_CALCULATE);
                  boolean reset = !modifier && InputUtil.isKeyPressed(window, KEY_RESET);
                  boolean fade = !modifier && InputUtil.isKeyPressed(window, KEY_FADE);
                  boolean brighten = !modifier && InputUtil.isKeyPressed(window, KEY_BRIGHTEN);

                  if (capture && !prevCapture) {
                      capture(client.player);
                  }
                  if (calculate && !prevCalculate) {
                      calculate();
                  }
                  if (reset && !prevReset) {
                      reset();
                  }
                  if (fade && !prevFade) {
                      showNotice("Opacity " + StrongholdConfig.adjustOpacity(-StrongholdConfig.OPACITY_STEP) + "%");
                  }
                  if (brighten && !prevBrighten) {
                      showNotice("Opacity " + StrongholdConfig.adjustOpacity(StrongholdConfig.OPACITY_STEP) + "%");
                  }

                  prevCapture = capture;
                  prevCalculate = calculate;
                  prevReset = reset;
                  prevFade = fade;
                  prevBrighten = brighten;
              }

              // ----------------------------------------------------------------- state

              private static void capture(ClientPlayerEntity player) {
                  // In 1.16.1 yaw is a public field on Entity; there is no getYaw()
                  // accessor on this version.
                  MEASUREMENTS.add(new EyeMeasurement(player.getX(), player.getZ(), player.yaw));

                  while (MEASUREMENTS.size() > MAX_MEASUREMENTS) {
                      // Third and later measurements replace the oldest one.
                      MEASUREMENTS.remove(0);
                  }

                  if (MEASUREMENTS.size() >= CALCULATOR.minimumMeasurements()) {
                      // Recalculate automatically, the way the reference tool updates as
                      // soon as it has enough throws.
                      calculate();
                  }
              }

              private static void calculate() {
                  if (MEASUREMENTS.size() < CALCULATOR.minimumMeasurements()) {
                      showNotice("Need 2 Eye measurements");
                      return;
                  }

                  StrongholdCalculator.Result calculated = CALCULATOR.calculate(MEASUREMENTS);
                  if (!calculated.isSuccess()) {
                      results = null;
                      showNotice(calculated.error());
                      return;
                  }

                  results = calculated.candidates();
                  notice = null;
              }

              private static void reset() {
                  MEASUREMENTS.clear();
                  results = null;
                  notice = null;
              }

              private static void showNotice(String text) {
                  notice = text;
                  noticeExpiresAt = System.currentTimeMillis() + NOTICE_DURATION_MS;
              }

              // --------------------------------------------------------------- drawing

              private static void draw(MinecraftClient client, MatrixStack matrices) {
                  boolean hasContent = !MEASUREMENTS.isEmpty() || (results != null && !results.isEmpty());

                  if (hasContent) {
                      drawPanel(client, matrices);
                  }

                  if (notice != null) {
                      if (System.currentTimeMillis() > noticeExpiresAt) {
                          notice = null;
                      } else {
                          int y = hasContent ? (PANEL_Y + panelHeight() + 4) : PANEL_Y;
                          text(client, matrices, notice, PANEL_X + PADDING, y, COLOR_NOTICE);
                      }
                  }
              }

              private static int candidateRows() {
                  return results == null ? 0 : results.size();
              }

              private static int panelHeight() {
                  int height = TITLE_BAR_HEIGHT;

                  if (candidateRows() > 0) {
                      height += 3;
                      height += ROW_HEIGHT;                       // column headers
                      height += candidateRows() * ROW_HEIGHT;     // candidates
                      height += 4;
                  }

                  height += 1;                                    // separator
                  height += 3;
                  height += ROW_HEIGHT;                           // "Ender eye throws"
                  height += ROW_HEIGHT;                           // column headers
                  height += MEASUREMENTS.size() * ROW_HEIGHT;
                  height += PADDING;

                  return height;
              }

              private static void drawPanel(MinecraftClient client, MatrixStack matrices) {
                  int left = PANEL_X;
                  int top = PANEL_Y;
                  int right = left + PANEL_WIDTH;
                  int bottom = top + panelHeight();

                  fill(matrices, left, top, right, bottom, PANEL_BACKGROUND);
                  fill(matrices, left, top, right, top + TITLE_BAR_HEIGHT, TITLE_BAR_BACKGROUND);

                  int y = top + 3;

                  text(client, matrices, "Stronghold Finder", left + PADDING, y, COLOR_TITLE);
                  int titleWidth = client.textRenderer.getWidth("Stronghold Finder");
                  text(client, matrices, VERSION, left + PADDING + titleWidth + 4, y, COLOR_VERSION);

                  y = top + TITLE_BAR_HEIGHT;

                  if (candidateRows() > 0) {
                      y += 3;

                      centred(client, matrices, "Chunk", left + COL_CHUNK_CENTRE, y, COLOR_HEADER);
                      rightAligned(client, matrices, "%", left + COL_PERCENT_RIGHT, y, COLOR_HEADER);
                      rightAligned(client, matrices, "Dist.", left + COL_DIST_RIGHT, y, COLOR_HEADER);
                      centred(client, matrices, "Nether", left + COL_NETHER_CENTRE, y, COLOR_HEADER);
                      y += ROW_HEIGHT;

                      for (int i = 0; i < results.size(); i++) {
                          StrongholdPrediction candidate = results.get(i);

                          String chunk = "(" + Math.floorDiv(candidate.overworldX, 16)
                              + ", " + Math.floorDiv(candidate.overworldZ, 16) + ")";
                          String nether = "(" + candidate.netherX() + ", " + candidate.netherZ() + ")";

                          double dx = candidate.overworldX - client.player.getX();
                          double dz = candidate.overworldZ - client.player.getZ();
                          long distance = Math.round(Math.sqrt((dx * dx) + (dz * dz)));

                          centred(client, matrices, chunk, left + COL_CHUNK_CENTRE, y, COLOR_COORD);

                          if (candidate.hasCertainty()) {
                              double percent = candidate.certainty * 100.0D;
                              rightAligned(client, matrices, decimals(percent, 1) + "%",
                                  left + COL_PERCENT_RIGHT, y, percentColor(percent));
                          } else {
                              rightAligned(client, matrices, "-", left + COL_PERCENT_RIGHT, y, COLOR_NUMBER);
                          }

                          rightAligned(client, matrices, Long.toString(distance),
                              left + COL_DIST_RIGHT, y, COLOR_NUMBER);
                          centred(client, matrices, nether, left + COL_NETHER_CENTRE, y, COLOR_COORD);

                          y += ROW_HEIGHT;
                      }

                      y += 4;
                  }

                  fill(matrices, left + PADDING, y, right - PADDING, y + 1, SEPARATOR);
                  y += 1 + 3;

                  text(client, matrices, "Ender eye throws", left + PADDING, y, COLOR_SECTION);
                  y += ROW_HEIGHT;

                  rightAligned(client, matrices, "x", left + COL_THROW_X_RIGHT, y, COLOR_HEADER);
                  rightAligned(client, matrices, "z", left + COL_THROW_Z_RIGHT, y, COLOR_HEADER);
                  rightAligned(client, matrices, "Angle", left + COL_THROW_ANGLE_RIGHT, y, COLOR_HEADER);
                  rightAligned(client, matrices, "Error", left + COL_THROW_ERROR_RIGHT, y, COLOR_HEADER);
                  y += ROW_HEIGHT;

                  StrongholdPrediction best = (results == null || results.isEmpty()) ? null : results.get(0);

                  for (int i = 0; i < MEASUREMENTS.size(); i++) {
                      EyeMeasurement measurement = MEASUREMENTS.get(i);

                      rightAligned(client, matrices, decimals(measurement.x, 2),
                          left + COL_THROW_X_RIGHT, y, COLOR_COORD);
                      rightAligned(client, matrices, decimals(measurement.z, 2),
                          left + COL_THROW_Z_RIGHT, y, COLOR_COORD);
                      rightAligned(client, matrices, decimals(measurement.yaw, 2),
                          left + COL_THROW_ANGLE_RIGHT, y, COLOR_NUMBER);

                      if (best == null) {
                          rightAligned(client, matrices, "-", left + COL_THROW_ERROR_RIGHT, y, COLOR_NUMBER);
                      } else {
                          // How far this measured angle sits from the angle to the top
                          // candidate, assuming that candidate is correct.
                          double error = angleError(measurement, best);
                          rightAligned(client, matrices, decimals(error, 3),
                              left + COL_THROW_ERROR_RIGHT, y, errorColor(error));
                      }

                      y += ROW_HEIGHT;
                  }
              }

              /** Residual in degrees between a measured angle and the predicted target. */
              private static double angleError(EyeMeasurement measurement, StrongholdPrediction prediction) {
                  double predicted = Math.toDegrees(Math.atan2(
                      -(prediction.overworldX - measurement.x),
                      prediction.overworldZ - measurement.z));

                  double difference = (predicted - measurement.yaw + 180.0D) % 360.0D;
                  if (difference < 0.0D) {
                      difference += 360.0D;
                  }
                  return difference - 180.0D;
              }

              private static int percentColor(double percent) {
                  if (percent >= PERCENT_HIGH) {
                      return COLOR_HIGH;
                  }
                  if (percent >= PERCENT_MEDIUM) {
                      return COLOR_MEDIUM;
                  }
                  return COLOR_LOW;
              }

              private static int errorColor(double error) {
                  double magnitude = Math.abs(error);
                  if (magnitude <= ERROR_GOOD) {
                      return COLOR_HIGH;
                  }
                  if (magnitude <= ERROR_FAIR) {
                      return COLOR_MEDIUM;
                  }
                  return COLOR_LOW;
              }

              // ------------------------------------------------------------- utilities

              private static void fill(MatrixStack matrices, int x1, int y1, int x2, int y2, int rgb) {
                  DrawableHelper.fill(matrices, x1, y1, x2, y2, StrongholdConfig.applyOpacity(rgb));
              }

              /** Flat text, no drop shadow: the panel reads as a UI rather than a HUD. */
              private static void text(MinecraftClient client, MatrixStack matrices,
                                       String value, int x, int y, int rgb) {
                  client.textRenderer.draw(matrices, value, x, y, StrongholdConfig.applyOpacity(rgb));
              }

              private static void centred(MinecraftClient client, MatrixStack matrices,
                                          String value, int centreX, int y, int rgb) {
                  int width = client.textRenderer.getWidth(value);
                  text(client, matrices, value, centreX - (width / 2), y, rgb);
              }

              private static void rightAligned(MinecraftClient client, MatrixStack matrices,
                                               String value, int rightX, int y, int rgb) {
                  int width = client.textRenderer.getWidth(value);
                  text(client, matrices, value, rightX - width, y, rgb);
              }

              /**
               * Fixed decimal places without String.format, which drags in locale
               * handling and would print commas for some players.
               */
              private static String decimals(double value, int places) {
                  long scale = 1L;
                  for (int i = 0; i < places; i++) {
                      scale *= 10L;
                  }

                  long scaled = Math.round(value * scale);
                  boolean negative = scaled < 0L;
                  if (negative) {
                      scaled = -scaled;
                  }

                  String fraction = Long.toString(scaled % scale);
                  while (fraction.length() < places) {
                      fraction = "0" + fraction;
                  }

                  String text = (scaled / scale) + "." + fraction;
                  return negative ? ("-" + text) : text;
              }

              public static String calculatorName() {
                  return CALCULATOR.name();
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold/calc
          cat > src/main/java/com/adamarmanyos/stronghold/calc/EyeMeasurement.java <<'SFEOF'
          package com.adamarmanyos.stronghold.calc;

          /**
           * A single Eye of Ender measurement: where the player stood and which way they
           * were looking when the eye's flight direction was read off.
           *
           * Yaw is stored exactly as Minecraft reports it (degrees, unbounded).
           */
          public final class EyeMeasurement {

              public final double x;
              public final double z;
              public final float yaw;

              public EyeMeasurement(double x, double z, float yaw) {
                  this.x = x;
                  this.z = z;
                  this.yaw = yaw;
              }

              /**
               * Horizontal unit direction vector for this measurement.
               *
               * Minecraft yaw convention (1.16.1, unchanged for many versions):
               *   yaw    0 -> facing south, +Z
               *   yaw   90 -> facing west,  -X
               *   yaw  180 -> facing north, -Z
               *   yaw  270 -> facing east,  +X
               *
               * which gives dx = -sin(yaw), dz = +cos(yaw).
               */
              public double[] direction() {
                  double rad = Math.toRadians(this.yaw);
                  return new double[] { -Math.sin(rad), Math.cos(rad) };
              }

              @Override
              public String toString() {
                  return "EyeMeasurement[x=" + this.x + ", z=" + this.z + ", yaw=" + this.yaw + "]";
              }
          }
