          package com.adamarmanyos.stronghold.calc;

          /**
           * Stronghold generation constants and the radial density approximation, ported
           * from Ninjabrain Bot 1.5.2 (GPL-3.0, Ninjabrain1/Ninjabrain-Bot).
           *
           * All radii here are in CHUNKS, matching the original. Vanilla places ring k at
           * 32 * (4 + 6k) chunks from the origin with a spread of +/- 1.25 * 32, and
           * afterwards the biome search can move the structure by up to 7 chunks in each
           * axis.
           */
          public final class StrongholdRings {

              public static final int SNAPPING_RADIUS = 7;
              public static final int DISTANCE_PARAM = 32;
              public static final int RING_COUNT = 8;

              /** Strongholds generated in each ring. */
              public static final int[] STRONGHOLDS_IN_RING = { 3, 6, 10, 15, 21, 28, 36, 9 };

              /**
               * The block within a chunk that an Ender eye points at. 8 before 1.19,
               * 0 afterwards. 1.16.1 is the former.
               */
              public static final int EYE_TARGET_IN_CHUNK = 8;

              /** The starter staircase within the stronghold chunk. */
              public static final int STAIRCASE_IN_CHUNK = 4;

              /** Furthest chunk any stronghold can occupy. */
              public static final int MAX_CHUNK = (int) ((DISTANCE_PARAM
                  * ((4 + ((RING_COUNT - 1) * 6)) + (0.5D * 2.5D))) + (2 * SNAPPING_RADIUS) + 1);

              private static final int DELTA_R = 1;

              private static double[] density;
              private static double[] cumulativeRadial;

              private StrongholdRings() {
              }

              public static double innerRadius(int ring) {
                  return DISTANCE_PARAM * ((4 + (ring * 6)) - (0.5D * 2.5D));
              }

              public static double outerRadius(int ring) {
                  return DISTANCE_PARAM * ((4 + (ring * 6)) + (0.5D * 2.5D));
              }

              public static double innerRadiusPostSnapping(int ring) {
                  return innerRadius(ring) - ((SNAPPING_RADIUS + 1.0D) * Math.sqrt(2.0D));
              }

              public static double outerRadiusPostSnapping(int ring) {
                  return outerRadius(ring) + ((SNAPPING_RADIUS + 1.0D) * Math.sqrt(2.0D));
              }

              /** Ring index whose post-snapping band contains this chunk radius, or -1. */
              public static int ringAt(double chunkRadius) {
                  for (int ring = 0; ring < RING_COUNT; ring++) {
                      if (chunkRadius >= innerRadiusPostSnapping(ring)
                          && chunkRadius <= outerRadiusPostSnapping(ring)) {
                          return ring;
                      }
                  }
                  return -1;
              }

              /**
               * Chunk-offset frequencies produced by the biome search. Derived exactly as
               * the original does, from an arithmetic shift over -26..30.
               */
              public static int[] offsetWeights() {
                  int[] weights = new int[(2 * SNAPPING_RADIUS) + 1];
                  for (int i = -26; i <= 30; i++) {
                      int offset = -(i >> 2);
                      if (offset >= -SNAPPING_RADIUS && offset <= SNAPPING_RADIUS) {
                          weights[offset + SNAPPING_RADIUS]++;
                      }
                  }
                  return weights;
              }

              /**
               * Furthest a stronghold can be from the given overworld position, in blocks.
               * Used to rule out chunks that no eye at this position could point at.
               */
              public static double maxDistance(double x, double z) {
                  double r = Math.sqrt((x * x) + (z * z)) / 16.0D;
                  double maxDistance = Double.POSITIVE_INFINITY;

                  for (int ring = 0; ring < RING_COUNT; ring++) {
                      double inner = innerRadius(ring);
                      double outer = outerRadius(ring);
                      double angle = Math.PI / STRONGHOLDS_IN_RING[ring];

                      double a = (inner * inner) + (r * r) - (2 * r * inner * Math.cos(angle));
                      double b = (outer * outer) + (r * r) - (2 * r * outer * Math.cos(angle));
                      double max = Math.sqrt(a > b ? a : b);

                      if (max < maxDistance) {
                          maxDistance = max;
                      }
                  }

                  return (maxDistance + (Math.sqrt(2.0D) * (SNAPPING_RADIUS + 0.5D))) * 16.0D;
              }

              /**
               * Stronghold density as a function of chunk radius, already smoothed for
               * biome snapping.
               *
               * This replaces the two-dimensional convolution an earlier version of this
               * mod used. Because the density only depends on distance from the origin,
               * the snapping kernel can be projected onto the radial axis once and the
               * whole prior becomes a one-dimensional lookup.
               */
              public static synchronized double density(double chunkX, double chunkZ) {
                  init();
                  double radius = Math.sqrt((chunkX * chunkX) + (chunkZ * chunkZ)) / DELTA_R;
                  int low = (int) radius;
                  int high = low + 1;
                  double t = radius - low;
                  if (high >= density.length) {
                      return 0.0D;
                  }
                  return ((1.0D - t) * density[low]) + (t * density[high]);
              }

              /** Cumulative probability out to the given chunk radius. */
              public static synchronized double cumulativePolar(double radius) {
                  if (radius < 0.0D) {
                      return 0.0D;
                  }
                  init();
                  double k = radius / DELTA_R;
                  int low = (int) k;
                  int high = low + 1;
                  double t = k - low;
                  if (high >= cumulativeRadial.length) {
                      return cumulativeRadial[cumulativeRadial.length - 1];
                  }
                  return ((1.0D - t) * cumulativeRadial[low]) + (t * cumulativeRadial[high]);
              }

              private static void init() {
                  if (density != null) {
                      return;
                  }

                  int size = (MAX_CHUNK / DELTA_R) + 5;
                  double[] preSnapping = new double[size];

                  for (int ring = 0; ring < RING_COUNT; ring++) {
                      int c0 = (int) innerRadius(ring);
                      int c1 = (int) outerRadius(ring);
                      for (int i = c0; i <= c1; i += DELTA_R) {
                          double rho = STRONGHOLDS_IN_RING[ring]
                              / (2.0D * Math.PI * (outerRadius(ring) - innerRadius(ring)) * i);
                          if (i == c0 || i == c1) {
                              rho *= 0.5D;
                          }
                          if ((i / DELTA_R) < size) {
                              preSnapping[i / DELTA_R] = rho;
                          }
                      }
                  }

                  // Project the square snapping kernel onto the radial axis by averaging
                  // it over all approach angles.
                  double[] filter = new double[(int) Math.ceil(
                      SNAPPING_RADIUS / (double) DELTA_R * Math.sqrt(2.0D)) + 1];
                  double sum = 0.0D;
                  int[] offsets = offsetWeights();

                  for (int k = -SNAPPING_RADIUS; k <= SNAPPING_RADIUS; k++) {
                      int xWeight = offsets[k + SNAPPING_RADIUS];
                      for (int l = -SNAPPING_RADIUS; l <= SNAPPING_RADIUS; l++) {
                          int zWeight = offsets[l + SNAPPING_RADIUS];
                          int w = xWeight * zWeight;
                          int n = 200;
                          for (int i = 0; i < n; i++) {
                              double phi = 2 * Math.PI * i / n;
                              int dr = Math.abs(Math.round(
                                  (float) (Math.sqrt((k * k) + (l * l)) * Math.sin(phi))));
                              if (dr < filter.length) {
                                  filter[dr] += w;
                                  sum += dr == 0 ? w : 2 * w;
                              }
                          }
                      }
                  }
                  for (int i = 0; i < filter.length; i++) {
                      filter[i] /= sum;
                  }

                  double[] smoothed = new double[size];
                  for (int i = 0; i < size; i++) {
                      for (int j = -filter.length + 1; j < filter.length; j++) {
                          if ((i + j) >= 0 && (i + j) < size) {
                              smoothed[i] += preSnapping[i + j] * filter[j < 0 ? -j : j];
                          }
                      }
                  }

                  double[] cumulative = new double[size];
                  double running = 0.0D;
                  for (int i = 0; i < size; i++) {
                      running += smoothed[i] * i * DELTA_R * 2.0D * Math.PI;
                      cumulative[i] = running;
                  }

                  density = smoothed;
                  cumulativeRadial = cumulative;
              }
          }
