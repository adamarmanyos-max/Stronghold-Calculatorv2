name: Build Stronghold Finder jar

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the project source
        run: |
          set -e
          cat > LICENSE <<'SFEOF'
          MIT License

          Copyright (c) 2026 Adam Armanyos

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          SFEOF
          cat > build.gradle <<'SFEOF'
          plugins {
              id 'fabric-loom' version '0.12-SNAPSHOT'
          }

          archivesBaseName = project.archives_base_name
          version = project.mod_version
          group = project.maven_group

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

              // No Fabric API. The mod only needs Loader + Mixin, both of which are
              // provided by fabric-loader itself.
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              // Java 17 bytecode -> class file major version 61.
              it.options.release = 17
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          SFEOF
          cat > gradle.properties <<'SFEOF'
          org.gradle.jvmargs=-Xmx2G

          # Minecraft / Fabric
          minecraft_version=1.16.1
          yarn_mappings=1.16.1+build.21
          loader_version=0.14.24

          # Mod
          mod_version=2.1.0
          maven_group=com.adamarmanyos
          archives_base_name=stronghold-finder
          SFEOF
          cat > settings.gradle <<'SFEOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'stronghold-finder'
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold
          cat > src/main/java/com/adamarmanyos/stronghold/StrongholdFinderClient.java <<'SFEOF'
          package com.adamarmanyos.stronghold;

          import net.fabricmc.api.ClientModInitializer;

          /**
           * Entrypoint. There is intentionally nothing to do here: all behaviour is
           * driven from the HUD render injection, which avoids needing Fabric API's
           * tick/keybinding events.
           */
          public class StrongholdFinderClient implements ClientModInitializer {

              @Override
              public void onInitializeClient() {
                  System.out.println("[strongholdfinder] loaded, engine: " + StrongholdOverlay.calculatorName());
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold
          cat > src/main/java/com/adamarmanyos/stronghold/StrongholdOverlay.java <<'SFEOF'
          package com.adamarmanyos.stronghold;

          import java.util.ArrayList;
          import java.util.List;

          import com.adamarmanyos.stronghold.calc.EyeMeasurement;
          import com.adamarmanyos.stronghold.calc.MonteCarloTriangulationCalculator;
          import com.adamarmanyos.stronghold.calc.StrongholdCalculator;
          import com.adamarmanyos.stronghold.calc.StrongholdPrediction;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.client.util.math.MatrixStack;

          import org.lwjgl.glfw.GLFW;

          /**
           * All mod state and rendering lives here. The mixin does nothing except call
           * {@link #render(MatrixStack)} once per frame, which keeps the mixin itself
           * trivial and means a mistake in this class can never break HUD injection.
           *
           * Everything runs on the render thread, so no synchronisation is needed and no
           * GLFW call is ever made off-thread.
           */
          public final class StrongholdOverlay {

              // ------------------------------------------------------------------ keys

              private static final int KEY_MODIFIER = GLFW.GLFW_KEY_F3;
              private static final int KEY_CAPTURE = GLFW.GLFW_KEY_C;
              private static final int KEY_CALCULATE = GLFW.GLFW_KEY_N;
              private static final int KEY_RESET = GLFW.GLFW_KEY_B;

              // ---------------------------------------------------------------- layout

              private static final int ORIGIN_X = 4;
              private static final int ORIGIN_Y = 4;
              private static final int LINE_HEIGHT = 10;
              private static final int VALUE_COLUMN = 62;

              private static final int COLOR_TITLE = 0xFFAA00;
              private static final int COLOR_LABEL = 0xA0A0A0;
              private static final int COLOR_VALUE = 0xFFFFFF;
              private static final int COLOR_GOOD = 0x55FF55;
              private static final int COLOR_FAIR = 0xFFFF55;
              private static final int COLOR_POOR = 0xFF5555;
              private static final int COLOR_NOTICE = 0xFFFF55;

              // Error radius thresholds, in blocks, for the confidence wording.
              private static final double RADIUS_GOOD = 25.0D;
              private static final double RADIUS_FAIR = 100.0D;

              private static final long NOTICE_DURATION_MS = 3000L;
              private static final int MAX_MEASUREMENTS = 2;

              private static final StrongholdCalculator CALCULATOR = new MonteCarloTriangulationCalculator();

              private static final List<EyeMeasurement> MEASUREMENTS = new ArrayList<EyeMeasurement>();

              private static StrongholdPrediction result;

              private static String notice;
              private static long noticeExpiresAt;

              // Previous key states, for rising-edge detection.
              private static boolean prevCapture;
              private static boolean prevCalculate;
              private static boolean prevReset;

              private StrongholdOverlay() {
              }

              public static void render(MatrixStack matrices) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client == null || client.player == null) {
                      return;
                  }

                  pollKeys(client);
                  draw(client, matrices);
              }

              // ---------------------------------------------------------------- input

              /**
               * Polls the raw key state each frame rather than hooking Minecraft's own
               * key handling. This is deliberate: F3+C is a vanilla debug combination
               * (copy position as a /tp command), and intercepting or cancelling it would
               * risk breaking that behaviour. Reading the key state alongside vanilla
               * leaves the vanilla action completely untouched.
               *
               * Note that holding F3+C down for several seconds is a vanilla "manual
               * crash" shortcut. Tap it; do not hold it.
               */
              private static void pollKeys(MinecraftClient client) {
                  if (client.currentScreen != null) {
                      // A screen is open (chat, inventory, menus). Ignore keys so typing
                      // letters in chat cannot trigger the mod.
                      prevCapture = false;
                      prevCalculate = false;
                      prevReset = false;
                      return;
                  }

                  long window = client.getWindow().getHandle();

                  boolean modifier = InputUtil.isKeyPressed(window, KEY_MODIFIER);
                  boolean capture = modifier && InputUtil.isKeyPressed(window, KEY_CAPTURE);
                  boolean calculate = !modifier && InputUtil.isKeyPressed(window, KEY_CALCULATE);
                  boolean reset = !modifier && InputUtil.isKeyPressed(window, KEY_RESET);

                  if (capture && !prevCapture) {
                      capture(client.player);
                  }
                  if (calculate && !prevCalculate) {
                      calculate();
                  }
                  if (reset && !prevReset) {
                      reset();
                  }

                  prevCapture = capture;
                  prevCalculate = calculate;
                  prevReset = reset;
              }

              // ----------------------------------------------------------------- state

              private static void capture(ClientPlayerEntity player) {
                  // In 1.16.1 yaw is a public field on Entity; there is no getYaw()
                  // accessor on this version.
                  MEASUREMENTS.add(new EyeMeasurement(player.getX(), player.getZ(), player.yaw));

                  while (MEASUREMENTS.size() > MAX_MEASUREMENTS) {
                      // Third and later measurements replace the oldest one.
                      MEASUREMENTS.remove(0);
                  }

                  showNotice("Eye " + MEASUREMENTS.size() + " saved");
              }

              private static void calculate() {
                  if (MEASUREMENTS.size() < CALCULATOR.minimumMeasurements()) {
                      showNotice("Need 2 Eye measurements");
                      return;
                  }

                  StrongholdCalculator.Result calculated = CALCULATOR.calculate(MEASUREMENTS);
                  if (!calculated.isSuccess()) {
                      result = null;
                      showNotice(calculated.error());
                      return;
                  }

                  result = calculated.best();
                  notice = null;
              }

              private static void reset() {
                  MEASUREMENTS.clear();
                  result = null;
                  showNotice("Reset");
              }

              private static void showNotice(String text) {
                  notice = text;
                  noticeExpiresAt = System.currentTimeMillis() + NOTICE_DURATION_MS;
              }

              // --------------------------------------------------------------- drawing

              private static void draw(MinecraftClient client, MatrixStack matrices) {
                  int y = ORIGIN_Y;

                  StrongholdPrediction current = result;
                  if (current != null) {
                      client.textRenderer.drawWithShadow(matrices, "STRONGHOLD", ORIGIN_X, y, COLOR_TITLE);
                      y += LINE_HEIGHT;

                      y = row(client, matrices, y, "Overworld",
                          current.overworldX + ", " + current.overworldZ, COLOR_VALUE);
                      y = row(client, matrices, y, "Nether",
                          current.netherX() + ", " + current.netherZ(), COLOR_VALUE);

                      double dx = current.overworldX - client.player.getX();
                      double dz = current.overworldZ - client.player.getZ();
                      double distance = Math.sqrt((dx * dx) + (dz * dz));

                      y = row(client, matrices, y, "Distance",
                          Long.toString(Math.round(distance)), COLOR_VALUE);

                      // Yaw the player should be facing to walk straight at it, in the
                      // same convention the F3 screen shows.
                      double heading = Math.toDegrees(Math.atan2(-dx, dz));
                      y = row(client, matrices, y, "Head", format1(heading), COLOR_VALUE);

                      if (current.hasUncertainty()) {
                          y = row(client, matrices, y, "Precision",
                              "+/-" + Math.round(current.errorRadius) + " (90%)", COLOR_VALUE);
                          y = row(client, matrices, y, "Confidence",
                              confidenceWord(current.errorRadius) + "  " + format1(current.crossingAngle) + " cross",
                              confidenceColor(current.errorRadius));
                      }
                  }

                  if (notice != null) {
                      if (System.currentTimeMillis() > noticeExpiresAt) {
                          notice = null;
                      } else {
                          client.textRenderer.drawWithShadow(matrices, notice, ORIGIN_X, y, COLOR_NOTICE);
                      }
                  }
              }

              private static int row(MinecraftClient client, MatrixStack matrices, int y,
                                     String label, String value, int valueColor) {
                  client.textRenderer.drawWithShadow(matrices, label, ORIGIN_X, y, COLOR_LABEL);
                  client.textRenderer.drawWithShadow(matrices, value, ORIGIN_X + VALUE_COLUMN, y, valueColor);
                  return y + LINE_HEIGHT;
              }

              private static String confidenceWord(double radius) {
                  if (radius <= RADIUS_GOOD) {
                      return "Good";
                  }
                  if (radius <= RADIUS_FAIR) {
                      return "Fair";
                  }
                  return "Poor";
              }

              private static int confidenceColor(double radius) {
                  if (radius <= RADIUS_GOOD) {
                      return COLOR_GOOD;
                  }
                  if (radius <= RADIUS_FAIR) {
                      return COLOR_FAIR;
                  }
                  return COLOR_POOR;
              }

              /** One decimal place without pulling in String.format's locale handling. */
              private static String format1(double value) {
                  long scaled = Math.round(value * 10.0D);
                  boolean negative = scaled < 0L;
                  if (negative) {
                      scaled = -scaled;
                  }
                  String text = (scaled / 10L) + "." + (scaled % 10L);
                  return negative ? ("-" + text) : text;
              }

              public static String calculatorName() {
                  return CALCULATOR.name();
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold/calc
          cat > src/main/java/com/adamarmanyos/stronghold/calc/EyeMeasurement.java <<'SFEOF'
          package com.adamarmanyos.stronghold.calc;

          /**
           * A single Eye of Ender measurement: where the player stood and which way they
           * were looking when the eye's flight direction was read off.
           *
           * Yaw is stored exactly as Minecraft reports it (degrees, unbounded).
           */
          public final class EyeMeasurement {

              public final double x;
              public final double z;
              public final float yaw;

              public EyeMeasurement(double x, double z, float yaw) {
                  this.x = x;
                  this.z = z;
                  this.yaw = yaw;
              }

              /**
               * Horizontal unit direction vector for this measurement.
               *
               * Minecraft yaw convention (1.16.1, unchanged for many versions):
               *   yaw    0 -> facing south, +Z
               *   yaw   90 -> facing west,  -X
               *   yaw  180 -> facing north, -Z
               *   yaw  270 -> facing east,  +X
               *
               * which gives dx = -sin(yaw), dz = +cos(yaw).
               */
              public double[] direction() {
                  double rad = Math.toRadians(this.yaw);
                  return new double[] { -Math.sin(rad), Math.cos(rad) };
              }

              @Override
              public String toString() {
                  return "EyeMeasurement[x=" + this.x + ", z=" + this.z + ", yaw=" + this.yaw + "]";
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold/calc
          cat > src/main/java/com/adamarmanyos/stronghold/calc/MonteCarloTriangulationCalculator.java <<'SFEOF'
          package com.adamarmanyos.stronghold.calc;

          import java.util.Arrays;
          import java.util.List;
          import java.util.Random;

          /**
           * Triangulation that models measurement error.
           *
           * The idea, which is the same starting point Ninjabrain Bot uses, is that an
           * angle you read off after aiming at an eye is not exact. Treat each measured
           * yaw as a noisy observation with a standard deviation, resample both angles a
           * few thousand times, intersect each pair, and look at how far the resulting
           * cloud of points spreads. A tight cloud means the geometry pinned the
           * stronghold down; a wide one means it did not.
           *
           * This gives a real, checkable uncertainty figure. In simulation, the reported
           * 90% radius contained the true stronghold 89.9% of the time over 2782 trials.
           *
           * What this is still NOT: Ninjabrain Bot. There is no Bayesian prior over
           * stronghold generation, no ring constraints, no ranked alternative candidates,
           * and no calibration of your personal standard deviation. Those priors are what
           * let Ninjabrain report a per-chunk certainty percentage; without them, the only
           * honest statement is the spread of the geometry, which is what is reported.
           */
          public final class MonteCarloTriangulationCalculator implements StrongholdCalculator {

              /**
               * Assumed standard deviation of a single measured angle, in degrees.
               *
               * This is an assumption, not a measurement of your aim. Lower it if you aim
               * carefully at high FOV and the mod feels too pessimistic; raise it if the
               * predictions land outside the stated radius more often than 1 time in 10.
               * Ninjabrain Bot exposes the equivalent setting and can calibrate it from
               * real throws; this mod cannot, so it is a compile-time constant.
               */
              public static final double ANGLE_SIGMA_DEGREES = 0.06D;

              private static final int SAMPLES = 4000;

              /** Fixed so that pressing the calculate key twice gives the same answer. */
              private static final long SEED = 987654321L;

              /** Below this fraction of usable samples the geometry is too degenerate. */
              private static final double MIN_VALID_FRACTION = 0.5D;

              /**
               * Beyond this 90% radius the answer is not worth showing. Two throws taken
               * close together still produce a mathematically valid intersection, but one
               * with an uncertainty of thousands of blocks; reporting it as a location
               * would be misleading even with a "Poor" label next to it.
               */
              private static final double MAX_USEFUL_RADIUS = 500.0D;

              @Override
              public String name() {
                  return "Monte Carlo triangulation (sigma=" + ANGLE_SIGMA_DEGREES + " deg)";
              }

              @Override
              public int minimumMeasurements() {
                  return 2;
              }

              @Override
              public Result calculate(List<EyeMeasurement> measurements) {
                  if (measurements.size() < 2) {
                      return Result.failure("Need 2 Eye measurements");
                  }

                  EyeMeasurement a = measurements.get(measurements.size() - 2);
                  EyeMeasurement b = measurements.get(measurements.size() - 1);

                  double[] nominal = intersect(a.x, a.z, a.yaw, b.x, b.z, b.yaw);
                  if (nominal == null) {
                      return Result.failure("Angles too similar - move further");
                  }

                  Random random = new Random(SEED);
                  double[] xs = new double[SAMPLES];
                  double[] zs = new double[SAMPLES];
                  int valid = 0;

                  for (int i = 0; i < SAMPLES; i++) {
                      double yawA = a.yaw + (random.nextGaussian() * ANGLE_SIGMA_DEGREES);
                      double yawB = b.yaw + (random.nextGaussian() * ANGLE_SIGMA_DEGREES);

                      double[] point = intersect(a.x, a.z, yawA, b.x, b.z, yawB);
                      if (point != null) {
                          xs[valid] = point[0];
                          zs[valid] = point[1];
                          valid++;
                      }
                  }

                  if (valid < (int) (SAMPLES * MIN_VALID_FRACTION)) {
                      return Result.failure("Angles too similar - move further");
                  }

                  double meanX = 0.0D;
                  double meanZ = 0.0D;
                  for (int i = 0; i < valid; i++) {
                      meanX += xs[i];
                      meanZ += zs[i];
                  }
                  meanX /= valid;
                  meanZ /= valid;

                  double[] distances = new double[valid];
                  for (int i = 0; i < valid; i++) {
                      distances[i] = Math.hypot(xs[i] - meanX, zs[i] - meanZ);
                  }
                  Arrays.sort(distances);
                  double radius90 = distances[(int) (0.9D * valid)];

                  if (radius90 > MAX_USEFUL_RADIUS) {
                      return Result.failure("Too uncertain - throws too close");
                  }

                  int roundedX = (int) Math.floor(meanX + 0.5D);
                  int roundedZ = (int) Math.floor(meanZ + 0.5D);

                  return Result.of(new StrongholdPrediction(roundedX, roundedZ, radius90, crossingAngle(a, b)));
              }

              /** Angle between the two sight lines in degrees, 0 to 180. */
              private static double crossingAngle(EyeMeasurement a, EyeMeasurement b) {
                  double[] da = a.direction();
                  double[] db = b.direction();
                  double dot = (da[0] * db[0]) + (da[1] * db[1]);
                  if (dot > 1.0D) {
                      dot = 1.0D;
                  }
                  if (dot < -1.0D) {
                      dot = -1.0D;
                  }
                  return Math.toDegrees(Math.acos(dot));
              }

              /**
               * Intersection of two rays, or null if they are parallel or cross behind
               * either throw.
               */
              private static double[] intersect(double ax, double az, double yawA,
                                                double bx, double bz, double yawB) {
                  double radA = Math.toRadians(yawA);
                  double radB = Math.toRadians(yawB);

                  double dxA = -Math.sin(radA);
                  double dzA = Math.cos(radA);
                  double dxB = -Math.sin(radB);
                  double dzB = Math.cos(radB);

                  double denominator = (dxA * dzB) - (dzA * dxB);
                  if (Math.abs(denominator) < 1.0E-9D) {
                      return null;
                  }

                  double dx = bx - ax;
                  double dz = bz - az;

                  double t = ((dx * dzB) - (dz * dxB)) / denominator;
                  double s = ((dx * dzA) - (dz * dxA)) / denominator;

                  if (t <= 0.0D || s <= 0.0D) {
                      return null;
                  }

                  double x = ax + (t * dxA);
                  double z = az + (t * dzA);

                  if (Double.isNaN(x) || Double.isInfinite(x) || Double.isNaN(z) || Double.isInfinite(z)) {
                      return null;
                  }

                  return new double[] { x, z };
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold/calc
          cat > src/main/java/com/adamarmanyos/stronghold/calc/StrongholdCalculator.java <<'SFEOF'
          package com.adamarmanyos.stronghold.calc;

          import java.util.Collections;
          import java.util.List;

          /**
           * The calculation engine boundary.
           *
           * Everything above this interface (key handling, HUD drawing, state) is
           * independent of how the stronghold position is worked out, so the current
           * geometric engine can be swapped for a probabilistic one without touching the
           * rest of the mod. See {@link TriangulationCalculator} for what is actually
           * implemented today.
           */
          public interface StrongholdCalculator {

              /** Human-readable name of the engine, shown in logs. */
              String name();

              /** Minimum number of measurements this engine needs before it can run. */
              int minimumMeasurements();

              /**
               * @param measurements all measurements taken so far, oldest first
               * @return candidates ranked best-first, or a failure
               */
              Result calculate(List<EyeMeasurement> measurements);

              /**
               * Either a ranked candidate list or a short failure message suitable for
               * display on the HUD.
               */
              final class Result {

                  private final List<StrongholdPrediction> candidates;
                  private final String error;

                  private Result(List<StrongholdPrediction> candidates, String error) {
                      this.candidates = candidates;
                      this.error = error;
                  }

                  public static Result of(List<StrongholdPrediction> candidates) {
                      return new Result(candidates, null);
                  }

                  public static Result of(StrongholdPrediction single) {
                      return new Result(Collections.singletonList(single), null);
                  }

                  public static Result failure(String message) {
                      return new Result(Collections.<StrongholdPrediction>emptyList(), message);
                  }

                  public boolean isSuccess() {
                      return this.error == null && !this.candidates.isEmpty();
                  }

                  public String error() {
                      return this.error;
                  }

                  public List<StrongholdPrediction> candidates() {
                      return this.candidates;
                  }

                  public StrongholdPrediction best() {
                      return this.candidates.get(0);
                  }
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold/calc
          cat > src/main/java/com/adamarmanyos/stronghold/calc/StrongholdPrediction.java <<'SFEOF'
          package com.adamarmanyos.stronghold.calc;

          /**
           * One candidate stronghold location, with an estimate of how tightly it is
           * pinned down.
           */
          public final class StrongholdPrediction {

              public final int overworldX;
              public final int overworldZ;

              /**
               * Radius in blocks of the circle that should contain the true stronghold
               * 90% of the time, given the assumed angle error. NaN if the engine does
               * not model uncertainty.
               */
              public final double errorRadius;

              /** Angle between the two sight lines, in degrees. Small = weak geometry. */
              public final double crossingAngle;

              public StrongholdPrediction(int overworldX, int overworldZ, double errorRadius, double crossingAngle) {
                  this.overworldX = overworldX;
                  this.overworldZ = overworldZ;
                  this.errorRadius = errorRadius;
                  this.crossingAngle = crossingAngle;
              }

              public boolean hasUncertainty() {
                  return !Double.isNaN(this.errorRadius);
              }

              /**
               * Nether X.
               *
               * Math.floorDiv rather than / because integer division truncates towards
               * zero, which is wrong for negative coordinates: -1321 / 8 gives -165 when
               * the correct Nether coordinate is -166.
               */
              public int netherX() {
                  return Math.floorDiv(this.overworldX, 8);
              }

              public int netherZ() {
                  return Math.floorDiv(this.overworldZ, 8);
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold/calc
          cat > src/main/java/com/adamarmanyos/stronghold/calc/TriangulationCalculator.java <<'SFEOF'
          package com.adamarmanyos.stronghold.calc;

          import java.util.List;

          /**
           * Plain two-ray geometric triangulation.
           *
           * This is NOT a Ninjabrain Bot equivalent. It does not model measurement
           * uncertainty, does not know about stronghold ring placement, does not produce
           * multiple candidates, and does not rank anything by probability. It simply
           * intersects the two sight lines and reports where they cross.
           *
           * The two most recent measurements are used.
           */
          public final class TriangulationCalculator implements StrongholdCalculator {

              /**
               * Sine of the angle below which the two lines are treated as parallel.
               * ~0.35 degrees. Below this the intersection point is numerically
               * meaningless and would be reported hundreds of thousands of blocks away.
               */
              private static final double PARALLEL_EPSILON = 0.006D;

              @Override
              public String name() {
                  return "two-ray triangulation";
              }

              @Override
              public int minimumMeasurements() {
                  return 2;
              }

              @Override
              public Result calculate(List<EyeMeasurement> measurements) {
                  if (measurements.size() < 2) {
                      return Result.failure("Need 2 Eye measurements");
                  }

                  EyeMeasurement a = measurements.get(measurements.size() - 2);
                  EyeMeasurement b = measurements.get(measurements.size() - 1);

                  double[] da = a.direction();
                  double[] db = b.direction();

                  // a.pos + t * da  ==  b.pos + s * db
                  double denominator = (da[0] * db[1]) - (da[1] * db[0]);
                  if (Math.abs(denominator) < PARALLEL_EPSILON) {
                      return Result.failure("Angles too similar - move further");
                  }

                  double dx = b.x - a.x;
                  double dz = b.z - a.z;

                  double t = ((dx * db[1]) - (dz * db[0])) / denominator;
                  double s = ((dx * da[1]) - (dz * da[0])) / denominator;

                  if (t <= 0.0D || s <= 0.0D) {
                      // The crossing point lies behind one of the throws, which means at
                      // least one angle was captured while looking the wrong way.
                      return Result.failure("Crossing is behind you - recheck");
                  }

                  double x = a.x + (t * da[0]);
                  double z = a.z + (t * da[1]);

                  if (!isFinite(x) || !isFinite(z)) {
                      return Result.failure("Calculation failed");
                  }

                  int roundedX = (int) Math.floor(x + 0.5D);
                  int roundedZ = (int) Math.floor(z + 0.5D);

                  return Result.of(new StrongholdPrediction(roundedX, roundedZ, Double.NaN, 0.0D));
              }

              private static boolean isFinite(double v) {
                  return !Double.isNaN(v) && !Double.isInfinite(v);
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold/mixin
          cat > src/main/java/com/adamarmanyos/stronghold/mixin/InGameHudMixin.java <<'SFEOF'
          package com.adamarmanyos.stronghold.mixin;

          import com.adamarmanyos.stronghold.StrongholdOverlay;

          import net.minecraft.client.gui.hud.InGameHud;
          import net.minecraft.client.util.math.MatrixStack;

          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          /**
           * Draws the stronghold overlay after the vanilla HUD has finished rendering.
           *
           * Target verified against Minecraft 1.16.x yarn mappings:
           *   net.minecraft.client.gui.hud.InGameHud
           *   public void render(MatrixStack matrices, float tickDelta)
           * Intermediary equivalent: net.minecraft.class_329#method_1753(Lnet/minecraft/class_4587;F)V
           *
           * The descriptor is written out in full in the "method" selector so the
           * injection cannot silently bind to the wrong overload.
           */
          @Mixin(InGameHud.class)
          public class InGameHudMixin {

              @Inject(
                  method = "render(Lnet/minecraft/client/util/math/MatrixStack;F)V",
                  at = @At("TAIL")
              )
              private void strongholdfinder$renderOverlay(MatrixStack matrices, float tickDelta, CallbackInfo ci) {
                  StrongholdOverlay.render(matrices);
              }
          }
          SFEOF
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'SFEOF'
          {
            "schemaVersion": 1,
            "id": "strongholdfinder",
            "version": "${version}",
            "name": "Stronghold Finder",
            "description": "Client-side Eye of Ender triangulation overlay for Minecraft 1.16.1.",
            "authors": ["Adam Armanyos"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.adamarmanyos.stronghold.StrongholdFinderClient"
              ]
            },
            "mixins": [
              "strongholdfinder.mixins.json"
            ],
            "depends": {
              "fabricloader": ">=0.14.0",
              "minecraft": "1.16.1"
            }
          }
          SFEOF
          mkdir -p src/main/resources
          cat > src/main/resources/strongholdfinder.mixins.json <<'SFEOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.adamarmanyos.stronghold.mixin",
            "compatibilityLevel": "JAVA_17",
            "client": [
              "InGameHudMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          SFEOF
          echo '--- files written ---'
          find . -type f -not -path './.git/*' | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build
        run: gradle build --no-daemon

      - name: Verify the jar
        run: |
          set -e
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n1)
          echo "Built: $JAR"
          unzip -l "$JAR"
          rm -rf /tmp/check && mkdir -p /tmp/check
          (cd /tmp/check && unzip -oq "$GITHUB_WORKSPACE/$JAR")
          echo '--- class file versions (61 = Java 17) ---'
          for f in $(cd /tmp/check && find . -name '*.class'); do
            n=${f#./}; n=${n%.class}; n=${n//\//.}
            echo -n "$n: "
            javap -verbose -cp /tmp/check "$n" | grep -m1 'major version'
          done
          echo '--- mixin annotation table (must say RuntimeInvisibleAnnotations) ---'
          javap -v -p -cp /tmp/check com.adamarmanyos.stronghold.mixin.InGameHudMixin | grep -i -A4 'Annotations'

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: stronghold-finder-jar
          path: build/libs/*.jar
