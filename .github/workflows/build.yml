          package com.adamarmanyos.stronghold.calc;

          /**
           * A single Eye of Ender measurement: where the player stood and which way they
           * were looking when the eye's flight direction was read off.
           *
           * Yaw is stored exactly as Minecraft reports it (degrees, unbounded).
           */
          public final class EyeMeasurement {

              public final double x;
              public final double z;
              public final float yaw;

              /**
               * Assumed standard deviation of THIS measurement's angle, in degrees.
               *
               * Per measurement rather than global because the two ways of taking one are
               * not comparable: a bearing read off the eye's own flight path is roughly
               * fifty times more precise than a human aiming a crosshair at it.
               */
              public final double sigma;

              /** True when the angle came from the eye's flight rather than player yaw. */
              public final boolean fromEyeFlight;

              public EyeMeasurement(double x, double z, float yaw, double sigma, boolean fromEyeFlight) {
                  this.x = x;
                  this.z = z;
                  this.yaw = yaw;
                  this.sigma = sigma;
                  this.fromEyeFlight = fromEyeFlight;
              }

              /**
               * Horizontal unit direction vector for this measurement.
               *
               * Minecraft yaw convention (1.16.1, unchanged for many versions):
               *   yaw    0 -> facing south, +Z
               *   yaw   90 -> facing west,  -X
               *   yaw  180 -> facing north, -Z
               *   yaw  270 -> facing east,  +X
               *
               * which gives dx = -sin(yaw), dz = +cos(yaw).
               */
              public double[] direction() {
                  double rad = Math.toRadians(this.yaw);
                  return new double[] { -Math.sin(rad), Math.cos(rad) };
              }

              @Override
              public String toString() {
                  return "EyeMeasurement[x=" + this.x + ", z=" + this.z + ", yaw=" + this.yaw + "]";
              }
          }
