          package com.adamarmanyos.stronghold.calc;

          import java.util.ArrayList;
          import java.util.List;

          /**
           * Triangulation with a prior over Minecraft's stronghold generation.
           *
           * Vanilla 1.16 places 128 strongholds in eight rings around the world origin.
           * Within a ring the distance from origin is uniform and the angle is uniform,
           * so a stronghold cannot be just anywhere - it must lie inside one of a few
           * annular bands. This engine combines that constraint with the eye
           * measurements:
           *
           *   posterior(position) = prior(position) * product over eyes of
           *                         exp(-0.5 * (angle residual / sigma)^2)
           *
           * evaluated on a polar grid covering the first three rings, then clustered into
           * ranked candidates. The share of total posterior mass in each cluster is that
           * candidate's certainty.
           *
           * Ring bands are the vanilla generation values (ring N centre 4*32 + N*6*32
           * chunks, spread +/-40 chunks), widened by BIOME_SEARCH_MARGIN because after
           * choosing a ring position the game searches nearby for a valid biome and can
           * displace the stronghold from the ideal band.
           *
           * MEASURED BEHAVIOUR, from simulation before this was written:
           *
           *  - Certainty is well calibrated. Across 374 trials where it reported 80-100%
           *    certainty, the true stronghold was in the reported cluster 99% of the time.
           *  - It does NOT meaningfully improve the point estimate over plain
           *    triangulation when you have two decent throws. Median error and
           *    catastrophic-failure rate were within a couple of percent of the
           *    no-prior engine at every baseline tested.
           *  - A single measurement is not enough. The ray crosses all three ring bands,
           *    so the top candidate lands in the wrong ring most of the time (median
           *    error 6000 blocks). Two measurements are still required.
           *
           * So the prior buys a trustworthy confidence number and visible warning when
           * two locations both fit - not better coordinates. This is still not
           * Ninjabrain Bot, which additionally models which stronghold an eye points at,
           * supports many measurements, and calibrates sigma to the individual player.
           */
          public final class RingStrongholdCalculator implements StrongholdCalculator {

              /** Inner edge of each ring band, in blocks from the world origin. */
              private static final double[] RING_INNER = { 1408.0D, 4480.0D, 7552.0D };

              /** Outer edge of each ring band, in blocks. */
              private static final double[] RING_OUTER = { 2688.0D, 5760.0D, 8832.0D };

              /** Strongholds generated in each ring. Used to weight the prior. */
              private static final double[] RING_COUNT = { 3.0D, 6.0D, 10.0D };

              /** How far the post-placement biome search can displace a stronghold. */
              private static final double BIOME_SEARCH_MARGIN = 112.0D;

              /** Assumed standard deviation of one measured angle, in degrees. */
              public static final double ANGLE_SIGMA_DEGREES = 0.06D;

              private static final double GRID_RADIAL_STEP = 24.0D;
              private static final double GRID_ARC_STEP = 24.0D;

              /** Posterior mass within this radius of a peak counts as one candidate. */
              private static final double CLUSTER_RADIUS = 256.0D;

              private static final int MAX_CANDIDATES = 3;

              /** Candidates below this share of the posterior are not worth reporting. */
              private static final double MIN_REPORTED_CERTAINTY = 0.02D;

              private static final double REFINE_HALF_WIDTH = 48.0D;
              private static final double REFINE_STEP = 2.0D;

              /**
               * Cells whose angle is further than this many sigma from a measurement
               * contribute a factor of about exp(-18) and are skipped. Almost every cell
               * in the grid is nowhere near the sight lines, so this check removes most
               * of the work and keeps a calculation from stalling a frame.
               */
              private static final double MAX_RESIDUAL_SIGMAS = 6.0D;

              /** Distance buckets used to find the 90% radius without sorting. */
              private static final int RADIUS_BUCKETS = 32;

              // Grid, built once on first use and reused.
              private static float[] gridX;
              private static float[] gridZ;
              private static float[] gridPrior;

              @Override
              public String name() {
                  return "ring-aware Bayesian (sigma=" + ANGLE_SIGMA_DEGREES + " deg)";
              }

              @Override
              public int minimumMeasurements() {
                  return 2;
              }

              @Override
              public Result calculate(List<EyeMeasurement> measurements) {
                  if (measurements.size() < 2) {
                      return Result.failure("Need 2 Eye measurements");
                  }

                  buildGrid();

                  int cells = gridX.length;
                  double[] weights = new double[cells];

                  // Pass one: log likelihood of every cell, tracking the maximum so the
                  // exponential below cannot underflow to zero everywhere.
                  double cutoff = MAX_RESIDUAL_SIGMAS * ANGLE_SIGMA_DEGREES;
                  double maxLog = Double.NEGATIVE_INFINITY;

                  for (int i = 0; i < cells; i++) {
                      double logLikelihood = 0.0D;
                      boolean plausible = true;

                      for (int m = 0; m < measurements.size(); m++) {
                          EyeMeasurement measurement = measurements.get(m);
                          double predicted = Math.toDegrees(Math.atan2(
                              -(gridX[i] - measurement.x), gridZ[i] - measurement.z));
                          double residualDegrees = wrapDegrees(predicted - measurement.yaw);

                          if (Math.abs(residualDegrees) > cutoff) {
                              plausible = false;
                              break;
                          }

                          double residual = residualDegrees / ANGLE_SIGMA_DEGREES;
                          logLikelihood -= 0.5D * residual * residual;
                      }

                      if (!plausible) {
                          weights[i] = Double.NEGATIVE_INFINITY;
                          continue;
                      }

                      weights[i] = logLikelihood;
                      if (logLikelihood > maxLog) {
                          maxLog = logLikelihood;
                      }
                  }

                  if (maxLog == Double.NEGATIVE_INFINITY) {
                      return Result.failure("No stronghold fits those angles");
                  }

                  // Pass two: turn log likelihoods into posterior weights.
                  double total = 0.0D;
                  for (int i = 0; i < cells; i++) {
                      double w = gridPrior[i] * Math.exp(weights[i] - maxLog);
                      weights[i] = w;
                      total += w;
                  }

                  if (!(total > 0.0D)) {
                      return Result.failure("No stronghold fits those angles");
                  }

                  double crossing = crossingAngle(
                      measurements.get(measurements.size() - 2),
                      measurements.get(measurements.size() - 1));

                  List<StrongholdPrediction> candidates = new ArrayList<StrongholdPrediction>();

                  for (int c = 0; c < MAX_CANDIDATES; c++) {
                      int peak = -1;
                      double peakWeight = 0.0D;
                      for (int i = 0; i < cells; i++) {
                          if (weights[i] > peakWeight) {
                              peakWeight = weights[i];
                              peak = i;
                          }
                      }
                      if (peak < 0) {
                          break;
                      }

                      double cx = gridX[peak];
                      double cz = gridZ[peak];

                      // Collect this cluster: mass, a radius histogram, and then clear it
                      // so the next iteration finds a different location.
                      double clusterMass = 0.0D;
                      double[] buckets = new double[RADIUS_BUCKETS];
                      double clusterRadiusSq = CLUSTER_RADIUS * CLUSTER_RADIUS;

                      for (int i = 0; i < cells; i++) {
                          double dx = gridX[i] - cx;
                          double dz = gridZ[i] - cz;
                          double distanceSq = (dx * dx) + (dz * dz);
                          if (distanceSq <= clusterRadiusSq) {
                              double w = weights[i];
                              clusterMass += w;
                              int bucket = (int) (Math.sqrt(distanceSq) / CLUSTER_RADIUS * RADIUS_BUCKETS);
                              if (bucket >= RADIUS_BUCKETS) {
                                  bucket = RADIUS_BUCKETS - 1;
                              }
                              buckets[bucket] += w;
                              weights[i] = 0.0D;
                          }
                      }

                      double certainty = clusterMass / total;
                      if (c > 0 && certainty < MIN_REPORTED_CERTAINTY) {
                          break;
                      }

                      double radius90 = radiusContaining(buckets, clusterMass, 0.9D);
                      double[] refined = refine(measurements, cx, cz);

                      candidates.add(new StrongholdPrediction(
                          (int) Math.floor(refined[0] + 0.5D),
                          (int) Math.floor(refined[1] + 0.5D),
                          radius90,
                          crossing,
                          certainty));
                  }

                  if (candidates.isEmpty()) {
                      return Result.failure("No stronghold fits those angles");
                  }

                  return Result.of(candidates);
              }

              /**
               * The coarse grid only locates a candidate to within a cell. This runs a
               * fine local grid around the peak and returns the likelihood-weighted
               * centroid, which recovers the precision the coarse grid threw away.
               */
              private static double[] refine(List<EyeMeasurement> measurements, double cx, double cz) {
                  double sumWeight = 0.0D;
                  double sumX = 0.0D;
                  double sumZ = 0.0D;
                  double best = Double.NEGATIVE_INFINITY;

                  int steps = (int) ((2.0D * REFINE_HALF_WIDTH) / REFINE_STEP) + 1;
                  double[] logs = new double[steps * steps];
                  double[] xs = new double[steps * steps];
                  double[] zs = new double[steps * steps];

                  int n = 0;
                  for (int ix = 0; ix < steps; ix++) {
                      double x = cx - REFINE_HALF_WIDTH + (ix * REFINE_STEP);
                      for (int iz = 0; iz < steps; iz++) {
                          double z = cz - REFINE_HALF_WIDTH + (iz * REFINE_STEP);

                          double logLikelihood = 0.0D;
                          for (int m = 0; m < measurements.size(); m++) {
                              EyeMeasurement measurement = measurements.get(m);
                              double predicted = Math.toDegrees(Math.atan2(
                                  -(x - measurement.x), z - measurement.z));
                              double residual = wrapDegrees(predicted - measurement.yaw) / ANGLE_SIGMA_DEGREES;
                              logLikelihood -= 0.5D * residual * residual;
                          }

                          xs[n] = x;
                          zs[n] = z;
                          logs[n] = logLikelihood;
                          if (logLikelihood > best) {
                              best = logLikelihood;
                          }
                          n++;
                      }
                  }

                  for (int i = 0; i < n; i++) {
                      double w = Math.exp(logs[i] - best);
                      sumWeight += w;
                      sumX += xs[i] * w;
                      sumZ += zs[i] * w;
                  }

                  if (sumWeight <= 0.0D) {
                      return new double[] { cx, cz };
                  }
                  return new double[] { sumX / sumWeight, sumZ / sumWeight };
              }

              /** Smallest radius whose buckets hold the given fraction of the mass. */
              private static double radiusContaining(double[] buckets, double totalMass, double fraction) {
                  if (totalMass <= 0.0D) {
                      return CLUSTER_RADIUS;
                  }
                  double target = totalMass * fraction;
                  double running = 0.0D;
                  for (int i = 0; i < buckets.length; i++) {
                      running += buckets[i];
                      if (running >= target) {
                          return ((i + 1.0D) / buckets.length) * CLUSTER_RADIUS;
                      }
                  }
                  return CLUSTER_RADIUS;
              }

              /** Wrap a degree difference into (-180, 180]. */
              private static double wrapDegrees(double degrees) {
                  double wrapped = (degrees + 180.0D) % 360.0D;
                  if (wrapped < 0.0D) {
                      wrapped += 360.0D;
                  }
                  return wrapped - 180.0D;
              }

              private static double crossingAngle(EyeMeasurement a, EyeMeasurement b) {
                  double[] da = a.direction();
                  double[] db = b.direction();
                  double dot = (da[0] * db[0]) + (da[1] * db[1]);
                  if (dot > 1.0D) {
                      dot = 1.0D;
                  }
                  if (dot < -1.0D) {
                      dot = -1.0D;
                  }
                  return Math.toDegrees(Math.acos(dot));
              }

              /**
               * Polar grid over the ring bands. Stepping at a constant angular increment
               * per ring means every cell in that ring covers the same span of (r, theta)
               * and therefore carries the same prior mass, so no Jacobian correction is
               * needed when summing probabilities.
               */
              private static synchronized void buildGrid() {
                  if (gridX != null) {
                      return;
                  }

                  int[] angleSteps = new int[RING_INNER.length];
                  int[] radialSteps = new int[RING_INNER.length];
                  int cells = 0;

                  for (int ring = 0; ring < RING_INNER.length; ring++) {
                      double inner = RING_INNER[ring] - BIOME_SEARCH_MARGIN;
                      double outer = RING_OUTER[ring] + BIOME_SEARCH_MARGIN;

                      angleSteps[ring] = (int) Math.ceil((2.0D * Math.PI) / (GRID_ARC_STEP / outer));
                      radialSteps[ring] = (int) Math.ceil((outer - inner) / GRID_RADIAL_STEP);
                      cells += angleSteps[ring] * radialSteps[ring];
                  }

                  float[] xs = new float[cells];
                  float[] zs = new float[cells];
                  float[] priors = new float[cells];
                  int n = 0;

                  for (int ring = 0; ring < RING_INNER.length; ring++) {
                      double inner = RING_INNER[ring] - BIOME_SEARCH_MARGIN;
                      double angleStep = (2.0D * Math.PI) / angleSteps[ring];

                      // Prior mass per cell: the ring holds RING_COUNT strongholds spread
                      // uniformly over (r, theta), and this cell is one of many.
                      double cellPrior = RING_COUNT[ring] / (radialSteps[ring] * (double) angleSteps[ring]);

                      for (int ir = 0; ir < radialSteps[ring]; ir++) {
                          double r = inner + (ir * GRID_RADIAL_STEP);
                          for (int ia = 0; ia < angleSteps[ring]; ia++) {
                              double theta = ia * angleStep;
                              xs[n] = (float) (r * Math.cos(theta));
                              zs[n] = (float) (r * Math.sin(theta));
                              priors[n] = (float) cellPrior;
                              n++;
                          }
                      }
                  }

                  gridX = xs;
                  gridZ = zs;
                  gridPrior = priors;
              }
          }
