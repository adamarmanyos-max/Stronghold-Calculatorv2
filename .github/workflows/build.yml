          package com.adamarmanyos.stronghold.calc;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          /**
           * Discrete chunk posterior, ported from Ninjabrain Bot 1.5.2 (GPL-3.0,
           * Ninjabrain1/Ninjabrain-Bot).
           *
           * A stronghold does not sit at a continuous coordinate: generation puts it in a
           * chunk, and before 1.19 an Ender eye flies at (16*chunkX + 8, 16*chunkZ + 8).
           * So the thing to evaluate is a lattice of candidate chunks, each scored by how
           * well its exact target explains every measured angle.
           *
           * Three pieces, in order:
           *
           * 1. DOMAIN. Candidates are the chunks lying within a narrow cone around the
           *    first throw's sight line, out to 5000 blocks. The cone half-angle is
           *    min(1 degree, 30 sigma), so a precise measurement searches a narrower
           *    corridor and a vague one searches wider. This replaces the fixed box an
           *    earlier version used, which could not find a stronghold that fell outside
           *    it - a failure mode rather than an inaccuracy.
           *
           * 2. PRIOR. Each candidate is weighted by the stronghold density at its radius,
           *    already smoothed for biome snapping, and zeroed if it lies further from
           *    the throw than any stronghold possibly could.
           *
           * 3. LIKELIHOOD. For every throw, weight *= exp(-delta^2 / 2v), delta being the
           *    angle error in degrees and v the throw's variance plus a term for not
           *    knowing the throw position exactly. Renormalised after each throw.
           *
           * Then optionally the closest-stronghold condition: an eye points at the
           * NEAREST stronghold, so a candidate is only viable if no other stronghold in
           * any ring is likely to be closer. This integrates over the possible positions
           * of every other stronghold and is what the original calls advanced statistics.
           */
          public final class NinjabrainChunkCalculator implements StrongholdCalculator {

              /** How far along the sight line to search, in chunks. */
              private static final double RANGE_CHUNKS = 5000.0D / 16.0D;

              /** Widest cone half-angle, in degrees, however vague the measurement. */
              private static final double MAX_TOLERANCE_DEGREES = 1.0D;

              /** Cone half-angle as a multiple of the first throw's sigma. */
              private static final double TOLERANCE_SIGMAS = 30.0D;

              private static final int MAX_CANDIDATES = 3;
              private static final double MIN_REPORTED_CERTAINTY = 0.01D;

              /**
               * Largest lateral error from not knowing exactly where a throw happened, in
               * degree-blocks. A throw made against a block corner has none of this.
               */
              private static final double MAX_LATERAL_ERROR = 0.005D * Math.sqrt(2.0D) * 180.0D / Math.PI;

              /** Terms in the angular quadrature of the closest-stronghold condition. */
              private static final int K = 7;

              private final boolean useClosestStrongholdCondition;

              public NinjabrainChunkCalculator() {
                  this(true);
              }

              public NinjabrainChunkCalculator(boolean useClosestStrongholdCondition) {
                  this.useClosestStrongholdCondition = useClosestStrongholdCondition;
              }

              @Override
              public String name() {
                  return "Ninjabrain-style chunk posterior";
              }

              @Override
              public int minimumMeasurements() {
                  return 1;
              }

              @Override
              public Result calculate(List<EyeMeasurement> measurements) {
                  if (measurements.isEmpty()) {
                      return Result.failure("Need an Eye measurement");
                  }

                  EyeMeasurement first = measurements.get(0);
                  double tolerance = Math.min(MAX_TOLERANCE_DEGREES, TOLERANCE_SIGMAS * first.sigma);

                  List<int[]> candidates = coneChunks(first, tolerance);
                  if (candidates.isEmpty()) {
                      return Result.failure("No stronghold fits those angles");
                  }

                  double[] weights = new double[candidates.size()];
                  double maxDistanceChunks = StrongholdRings.maxDistance(first.x, first.z) / 16.0D;
                  double maxDistanceSquared = maxDistanceChunks * maxDistanceChunks;

                  for (int i = 0; i < candidates.size(); i++) {
                      int[] chunk = candidates.get(i);

                      double dx = chunk[0] - (first.x / 16.0D);
                      double dz = chunk[1] - (first.z / 16.0D);
                      if (((dx * dx) + (dz * dz)) > maxDistanceSquared) {
                          weights[i] = 0.0D;
                          continue;
                      }

                      // Two by two sub-sampling of the chunk, as the original does.
                      double weight = 0.0D;
                      for (int k = 0; k < 2; k++) {
                          for (int l = 0; l < 2; l++) {
                              weight += StrongholdRings.density(chunk[0] - 0.5D + k, chunk[1] - 0.5D + l);
                          }
                      }
                      weights[i] = weight / 4.0D;
                  }

                  for (int m = 0; m < measurements.size(); m++) {
                      condition(weights, candidates, measurements.get(m));
                  }

                  if (this.useClosestStrongholdCondition) {
                      applyClosestStrongholdCondition(weights, candidates, first);
                  }

                  double total = 0.0D;
                  for (int i = 0; i < weights.length; i++) {
                      total += weights[i];
                  }
                  if (!(total > 0.0D)) {
                      return Result.failure("No stronghold fits those angles");
                  }

                  List<StrongholdPrediction> ranked = rank(weights, candidates);
                  Result result = Result.of(ranked);
                  result.advice = advice(weights, candidates, first);
                  return result;
              }

              // ------------------------------------------------------------ the domain

              /**
               * Chunks within the cone around a throw's sight line.
               *
               * Walks outward one step at a time along whichever axis the ray runs more
               * steeply, and at each step takes the chunks between the two cone edges.
               * The grid is shifted by the eye's in-chunk target so that a chunk index
               * lines up with the point an eye actually aims at.
               */
              private static List<int[]> coneChunks(EyeMeasurement throwPoint, double toleranceDegrees) {
                  List<int[]> chunks = new ArrayList<int[]>();

                  double phi = Math.toRadians(throwPoint.yaw);
                  double tolerance = Math.toRadians(toleranceDegrees);

                  double dx = -Math.sin(phi);
                  double dz = Math.cos(phi);

                  double ux = -Math.sin(phi - tolerance);
                  double uz = Math.cos(phi - tolerance);
                  double vx = -Math.sin(phi + tolerance);
                  double vz = Math.cos(phi + tolerance);

                  boolean majorX = (Math.cos(phi) * Math.cos(phi)) < 0.5D;
                  boolean majorPositive = majorX ? (dx > 0.0D) : (dz > 0.0D);

                  double originMajor = ((majorX ? throwPoint.x : throwPoint.z)
                      - StrongholdRings.EYE_TARGET_IN_CHUNK) / 16.0D;
                  double originMinor = ((majorX ? throwPoint.z : throwPoint.x)
                      - StrongholdRings.EYE_TARGET_IN_CHUNK) / 16.0D;

                  double uk = majorX ? (uz / ux) : (ux / uz);
                  double vk = majorX ? (vz / vx) : (vx / vz);
                  boolean rightPositive = majorPositive ? ((vk - uk) > 0.0D) : ((uk - vk) > 0.0D);

                  int i = (int) (majorPositive ? Math.ceil(originMajor) : Math.floor(originMajor));

                  while (Math.abs((i - originMajor) / (majorX ? dx : dz)) < RANGE_CHUNKS) {
                      double minorU = originMinor + (uk * (i - originMajor));
                      double minorV = originMinor + (vk * (i - originMajor));

                      int j = (int) (rightPositive ? Math.ceil(minorU) : Math.floor(minorU));
                      if (j < -StrongholdRings.MAX_CHUNK) {
                          j = -StrongholdRings.MAX_CHUNK;
                      }
                      if (j > StrongholdRings.MAX_CHUNK) {
                          j = StrongholdRings.MAX_CHUNK;
                      }

                      while (rightPositive ? (j < minorV) : (j > minorV)) {
                          if (j > StrongholdRings.MAX_CHUNK || j < -StrongholdRings.MAX_CHUNK) {
                              break;
                          }
                          chunks.add(majorX ? new int[] { i, j } : new int[] { j, i });
                          j += rightPositive ? 1 : -1;
                      }

                      i += majorPositive ? 1 : -1;

                      if (chunks.size() > 400000) {
                          break;
                      }
                  }

                  return chunks;
              }

              // -------------------------------------------------------- the likelihood

              private static void condition(double[] weights, List<int[]> candidates,
                                            EyeMeasurement measurement) {
                  for (int i = 0; i < weights.length; i++) {
                      if (weights[i] <= 0.0D) {
                          continue;
                      }
                      int[] chunk = candidates.get(i);

                      double dx = (chunk[0] * 16) + StrongholdRings.EYE_TARGET_IN_CHUNK - measurement.x;
                      double dz = (chunk[1] * 16) + StrongholdRings.EYE_TARGET_IN_CHUNK - measurement.z;

                      double gamma = -180.0D / Math.PI * Math.atan2(dx, dz);
                      double delta = Math.abs((gamma - measurement.yaw) % 360.0D);
                      delta = Math.min(delta, 360.0D - delta);

                      double distanceSquared = (dx * dx) + (dz * dz);
                      double positionVariance = positionVariance(distanceSquared, measurement);
                      double variance = (measurement.sigma * measurement.sigma) + positionVariance;

                      weights[i] *= Math.exp(-(delta * delta) / (2.0D * variance));
                  }

                  normalise(weights);
              }

              /**
               * Variance from not knowing exactly where the throw happened. Zero when the
               * throw was made standing against a block corner, where the position is
               * exact.
               */
              private static double positionVariance(double distanceSquared, EyeMeasurement measurement) {
                  if (isBlockCorner(measurement.x) && isBlockCorner(measurement.z)) {
                      return 0.0D;
                  }
                  return (MAX_LATERAL_ERROR * MAX_LATERAL_ERROR) / distanceSquared / 6.0D;
              }

              private static boolean isBlockCorner(double coordinate) {
                  double fraction = coordinate - Math.floor(coordinate);
                  return Math.abs(fraction - 0.3D) < 1.0E-6D || Math.abs(fraction - 0.7D) < 1.0E-6D;
              }

              // ------------------------------------------- closest stronghold condition

              /**
               * An eye points at the nearest stronghold, so a candidate is only viable if
               * no other stronghold is likely to be closer. For each other stronghold
               * slot in each ring, this integrates the probability that it lies nearer
               * than the candidate, and multiplies the candidate down accordingly.
               */
              private void applyClosestStrongholdCondition(double[] weights, List<int[]> candidates,
                                                           EyeMeasurement throwPoint) {
                  Integer[] order = new Integer[weights.length];
                  for (int i = 0; i < order.length; i++) {
                      order[i] = Integer.valueOf(i);
                  }

                  final double[] byWeight = weights;
                  java.util.Arrays.sort(order, new java.util.Comparator<Integer>() {
                      @Override
                      public int compare(Integer a, Integer b) {
                          return Double.compare(byWeight[b.intValue()], byWeight[a.intValue()]);
                      }
                  });

                  double runningProbability = 0.0D;
                  int samples = 0;

                  for (int rank = 0; rank < order.length; rank++) {
                      int index = order[rank].intValue();
                      if (weights[index] <= 0.0D) {
                          continue;
                      }

                      // Only the chunks that matter get the full treatment; the long tail
                      // is approximated with the average found so far, exactly as the
                      // original does, because it is costly and cannot change the answer.
                      if (rank < 100 || weights[index] > 0.001D) {
                          double probability = closestStrongholdProbability(candidates.get(index), throwPoint);
                          weights[index] *= probability;
                          runningProbability += probability;
                          samples++;
                      } else if (samples > 0) {
                          weights[index] *= runningProbability / samples;
                      }
                  }

                  normalise(weights);
              }

              private double closestStrongholdProbability(int[] chunk, EyeMeasurement throwPoint) {
                  double deltaX = chunk[0]
                      + ((StrongholdRings.EYE_TARGET_IN_CHUNK - throwPoint.x) / 16.0D);
                  double deltaZ = chunk[1]
                      + ((StrongholdRings.EYE_TARGET_IN_CHUNK - throwPoint.z) / 16.0D);

                  double playerRadius = Math.sqrt((throwPoint.x * throwPoint.x)
                      + (throwPoint.z * throwPoint.z)) / 16.0D;
                  double candidateDistance = Math.sqrt((deltaX * deltaX) + (deltaZ * deltaZ));

                  double phiCandidate = phi(chunk[0], chunk[1]);
                  double phiPlayer = phi(throwPoint.x, throwPoint.z);

                  double maxDistance = StrongholdRings.maxDistance(throwPoint.x, throwPoint.z) / 16.0D;
                  double minRadius = playerRadius - maxDistance;
                  double maxRadius = playerRadius + maxDistance;

                  int candidateRing = StrongholdRings.ringAt(
                      Math.sqrt((chunk[0] * (double) chunk[0]) + (chunk[1] * (double) chunk[1])));
                  if (candidateRing < 0) {
                      return 0.0D;
                  }

                  double probability = 1.0D;

                  for (int ring = 0; ring < StrongholdRings.RING_COUNT; ring++) {
                      if (maxRadius < StrongholdRings.innerRadius(ring)
                          || minRadius > StrongholdRings.outerRadius(ring)) {
                          continue;
                      }

                      boolean sameRing = candidateRing == ring;
                      int strongholds = StrongholdRings.STRONGHOLDS_IN_RING[ring];

                      double ak = StrongholdRings.innerRadius(candidateRing);
                      double dphi = sameRing
                          ? (2.0D / ((2.0D * K) + 1) * 15 * Math.sqrt(2.0D) / ak)
                          : (2.0D / ((2.0D * K) + 1) * Math.PI / strongholds);

                      for (int l = 0; l < strongholds; l++) {
                          if (sameRing && l == 0) {
                              continue;
                          }
                          probability *= 1.0D - integral(ring, l, phiCandidate, dphi,
                              phiPlayer, playerRadius, candidateDistance, sameRing);
                      }
                  }

                  return probability;
              }

              private double integral(int ring, int l, double phiCandidate, double dphi,
                                      double phiPlayer, double playerRadius,
                                      double candidateDistance, boolean sameRing) {
                  int strongholds = StrongholdRings.STRONGHOLDS_IN_RING[ring];
                  double inner = StrongholdRings.innerRadius(ring);
                  double innerPost = StrongholdRings.innerRadiusPostSnapping(ring);
                  double outerPost = StrongholdRings.outerRadiusPostSnapping(ring);

                  double phiMean = phiCandidate + (l * 2 * Math.PI / strongholds);
                  double pdfIntegral = 0.0D;
                  double integral = 0.0D;

                  for (int k = -K; k <= K; k++) {
                      double deltaPhi = k * dphi;

                      double pdf = 1.0D;
                      if (sameRing) {
                          double scaled = deltaPhi * inner / (15 * Math.sqrt(2.0D));
                          pdf = Math.pow(1 + scaled, 4.5D) * Math.pow(1 - scaled, 4.5D);
                      }
                      pdfIntegral += pdf * dphi;

                      double gamma = phiPlayer - (phiMean + (k * dphi));
                      double sinBeta = playerRadius / candidateDistance * Math.sin(gamma);

                      if (sinBeta < 1.0D && sinBeta > -1.0D) {
                          double beta = Math.asin(sinBeta);
                          double alpha0 = beta - gamma;
                          double alpha1 = Math.PI - gamma - beta;

                          double r0 = candidateDistance * Math.sin(alpha0) / Math.sin(gamma);
                          double r1 = candidateDistance * Math.sin(alpha1) / Math.sin(gamma);

                          if (r1 > outerPost) {
                              r1 = outerPost;
                          }
                          if (r0 < innerPost) {
                              r0 = innerPost;
                          }
                          if (r0 > outerPost) {
                              r0 = outerPost;
                          }
                          if (r1 < innerPost) {
                              r1 = innerPost;
                          }

                          integral += pdf
                              * (StrongholdRings.cumulativePolar(r1) - StrongholdRings.cumulativePolar(r0))
                              * dphi / strongholds;
                      }
                  }

                  if (pdfIntegral == 0.0D) {
                      return 0.0D;
                  }

                  integral /= pdfIntegral;
                  return integral > 1.0D ? 1.0D : integral;
              }

              /**
               * What to do next, given the throws so far.
               *
               * After a single throw the sight line crosses the ring band over a long
               * stretch, so the useful things to report are how far along that stretch
               * the stronghold might be, and how far to walk sideways before throwing
               * again.
               *
               * The second number falls out of the geometry: error along the sight line
               * is roughly sigma * d^2 / baseline, so aiming for a quarter-chunk of error
               * needs a baseline of sigma * d^2 / 4. In simulation, walking the
               * recommended distance and throwing again put the answer in the exact chunk
               * 86% of the time, against 56% for a target of a full half-chunk.
               */
              private static String advice(double[] weights, List<int[]> candidates,
                                           EyeMeasurement first) {
                  double total = 0.0D;
                  for (int i = 0; i < weights.length; i++) {
                      total += weights[i];
                  }
                  if (!(total > 0.0D)) {
                      return null;
                  }

                  // Distance percentiles over the posterior, walking outward from the
                  // throw so the weights are visited in distance order.
                  double[] distances = new double[weights.length];
                  for (int i = 0; i < weights.length; i++) {
                      int[] chunk = candidates.get(i);
                      double dx = (chunk[0] * 16) + StrongholdRings.EYE_TARGET_IN_CHUNK - first.x;
                      double dz = (chunk[1] * 16) + StrongholdRings.EYE_TARGET_IN_CHUNK - first.z;
                      distances[i] = Math.sqrt((dx * dx) + (dz * dz));
                  }

                  Integer[] order = new Integer[weights.length];
                  for (int i = 0; i < order.length; i++) {
                      order[i] = Integer.valueOf(i);
                  }
                  final double[] byDistance = distances;
                  java.util.Arrays.sort(order, new java.util.Comparator<Integer>() {
                      @Override
                      public int compare(Integer a, Integer b) {
                          return Double.compare(byDistance[a.intValue()], byDistance[b.intValue()]);
                      }
                  });

                  double running = 0.0D;
                  double low = Double.NaN;
                  double median = Double.NaN;
                  double high = Double.NaN;

                  for (int rank = 0; rank < order.length; rank++) {
                      int index = order[rank].intValue();
                      running += weights[index];
                      if (Double.isNaN(low) && running >= 0.05D * total) {
                          low = distances[index];
                      }
                      if (Double.isNaN(median) && running >= 0.5D * total) {
                          median = distances[index];
                      }
                      if (running >= 0.95D * total) {
                          high = distances[index];
                          break;
                      }
                  }

                  if (Double.isNaN(median)) {
                      return null;
                  }
                  if (Double.isNaN(high)) {
                      high = distances[order[order.length - 1].intValue()];
                  }

                  double baseline = Math.toRadians(first.sigma) * median * median / TARGET_ERROR_BLOCKS;
                  if (baseline < 50.0D) {
                      baseline = 50.0D;
                  }

                  return Math.round(low) + "-" + Math.round(high) + " ahead, walk "
                      + Math.round(baseline) + " sideways";
              }

              /** Positional error the recommended second throw is aiming for. */
              private static final double TARGET_ERROR_BLOCKS = 4.0D;

              private static double phi(double x, double z) {
                  return -Math.atan2(x, z);
              }

              // ---------------------------------------------------------------- output

              private static void normalise(double[] weights) {
                  double total = 0.0D;
                  for (int i = 0; i < weights.length; i++) {
                      total += weights[i];
                  }
                  if (total <= 0.0D) {
                      return;
                  }
                  for (int i = 0; i < weights.length; i++) {
                      weights[i] /= total;
                  }
              }

              /**
               * Best chunks. The reported certainty is the chunk's own probability - a
               * stronghold is in exactly one chunk, so folding in the neighbours would
               * answer a different question and overstate the result.
               */
              private static List<StrongholdPrediction> rank(double[] weights, List<int[]> candidates) {
                  List<StrongholdPrediction> predictions = new ArrayList<StrongholdPrediction>();
                  boolean[] taken = new boolean[weights.length];

                  for (int pick = 0; pick < MAX_CANDIDATES; pick++) {
                      int best = -1;
                      double bestWeight = 0.0D;
                      for (int i = 0; i < weights.length; i++) {
                          if (!taken[i] && weights[i] > bestWeight) {
                              bestWeight = weights[i];
                              best = i;
                          }
                      }
                      if (best < 0) {
                          break;
                      }
                      if (pick > 0 && bestWeight < MIN_REPORTED_CERTAINTY) {
                          break;
                      }

                      int[] chunk = candidates.get(best);

                      // Adjacent chunks are not meaningfully different answers, so they
                      // are suppressed as rivals without their weight being counted here.
                      for (int i = 0; i < weights.length; i++) {
                          int[] other = candidates.get(i);
                          if (Math.abs(other[0] - chunk[0]) <= 1 && Math.abs(other[1] - chunk[1]) <= 1) {
                              taken[i] = true;
                          }
                      }

                      predictions.add(new StrongholdPrediction(
                          (chunk[0] * 16) + StrongholdRings.STAIRCASE_IN_CHUNK,
                          (chunk[1] * 16) + StrongholdRings.STAIRCASE_IN_CHUNK,
                          0.0D,
                          0.0D,
                          bestWeight));
                  }

                  if (predictions.isEmpty()) {
                      return Collections.<StrongholdPrediction>emptyList();
                  }
                  return predictions;
              }
          }
