name: Build Stronghold Finder jar

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the project source
        run: |
          set -e
          cat > LICENSE <<'SFEOF'
          MIT License

          Copyright (c) 2026 Adam Armanyos

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          SFEOF
          cat > build.gradle <<'SFEOF'
          plugins {
              id 'fabric-loom' version '0.12-SNAPSHOT'
          }

          archivesBaseName = project.archives_base_name
          version = project.mod_version
          group = project.maven_group

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

              // No Fabric API. The mod only needs Loader + Mixin, both of which are
              // provided by fabric-loader itself.
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              // Java 17 bytecode -> class file major version 61.
              it.options.release = 17
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          SFEOF
          cat > gradle.properties <<'SFEOF'
          org.gradle.jvmargs=-Xmx2G

          # Minecraft / Fabric
          minecraft_version=1.16.1
          yarn_mappings=1.16.1+build.21
          loader_version=0.14.24

          # Mod
          mod_version=4.4.0
          maven_group=com.adamarmanyos
          archives_base_name=stronghold-finder
          SFEOF
          cat > settings.gradle <<'SFEOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'stronghold-finder'
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold
          cat > src/main/java/com/adamarmanyos/stronghold/EyeTracker.java <<'SFEOF'
          package com.adamarmanyos.stronghold;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.EyeOfEnderEntity;

          /**
           * Watches a thrown Eye of Ender and derives the bearing to the stronghold from
           * its flight path instead of from where the player was looking.
           *
           * This is the one thing an in-game mod can do that an external calculator
           * cannot. Ninjabrain Bot only sees the number F3+C puts on the clipboard, so
           * its whole error model exists to cope with a human aiming a crosshair at a
           * small moving object - that error is typically 0.05 to 0.3 degrees and it
           * dominates everything else. The eye entity itself is already flying at the
           * stronghold, so sampling where it actually goes removes the human from the
           * measurement completely.
           *
           * Method: remember where the eye first appeared, then measure the horizontal
           * displacement to its latest position. The eye's horizontal heading is constant
           * for the whole flight - vanilla steers it toward a waypoint placed exactly
           * along the line to the structure - so that displacement is the bearing.
           *
           * Precision is set by how finely entity positions arrive over the network,
           * which is 1/4096 of a block. Over ten ticks of flight the eye covers about
           * 12 blocks, giving roughly 0.001 degrees - some fifty times better than
           * careful manual aiming.
           *
           * UNVERIFIED: this has not been tested in a running game. If the eye is not
           * found or has not flown far enough, capture falls back to player yaw, which
           * is what every earlier version used.
           */
          public final class EyeTracker {

              /** How far from the player to look for a thrown eye. */
              private static final double SEARCH_RADIUS = 72.0D;

              /** Minimum flight distance before the bearing is trusted. */
              private static final double MIN_TRAVEL = 3.0D;

              /**
               * Flight distance at which the bearing is good enough to offer.
               *
               * The measurement is NOT added at this point. The bearing is simply held
               * ready, and stays held after the eye has landed or vanished, so the player
               * can take their time and press F3+C whenever they like without losing the
               * precision that watching the flight bought. Adding throws is the player's
               * decision, not the mod's.
               */
              private static final double READY_TRAVEL = 10.0D;

              /**
               * Assumed angle error for a tracked eye, in degrees. Dominated by network
               * position quantisation rather than anything human.
               */
              public static final double TRACKED_SIGMA = 0.005D;

              private static int trackedEntityId = -1;

              private static double originX;
              private static double originZ;
              private static double latestX;
              private static double latestZ;
              private static boolean tracking;
              private static boolean captured;

              /** True when a bearing is held and waiting for the player to capture it. */
              public static boolean isReady() {
                  return tracking && !captured && travelled() >= READY_TRAVEL;
              }

              private EyeTracker() {
              }

              /**
               * Called once per frame. Picks up a thrown eye, keeps following the same
               * one, and forgets it once it is gone.
               */
              public static void tick(MinecraftClient client) {
                  ClientPlayerEntity player = client.player;
                  if (player == null || client.world == null) {
                      return;
                  }

                  // Walk the client's entity list rather than using a box query. The
                  // box-and-predicate lookup methods moved and changed signature across
                  // versions; ClientWorld.getEntities() has been stable, and the list is
                  // short enough that filtering here costs nothing.
                  EyeOfEnderEntity chosen = null;
                  EyeOfEnderEntity nearestEye = null;
                  double nearestDistance = SEARCH_RADIUS * SEARCH_RADIUS;

                  for (Entity entity : client.world.getEntities()) {
                      if (!(entity instanceof EyeOfEnderEntity)) {
                          continue;
                      }

                      EyeOfEnderEntity eye = (EyeOfEnderEntity) entity;

                      // Stay with the eye already being followed if it is still around.
                      if (eye.getEntityId() == trackedEntityId) {
                          chosen = eye;
                          break;
                      }

                      double distance = eye.squaredDistanceTo(player);
                      if (distance < nearestDistance) {
                          nearestDistance = distance;
                          nearestEye = eye;
                      }
                  }

                  if (chosen == null) {
                      if (nearestEye == null) {
                          return;
                      }
                      chosen = nearestEye;

                      trackedEntityId = chosen.getEntityId();
                      originX = chosen.getX();
                      originZ = chosen.getZ();
                      tracking = true;
                      captured = false;
                  }

                  latestX = chosen.getX();
                  latestZ = chosen.getZ();
              }

              /** True when a tracked eye has flown far enough to give a bearing. */
              public static boolean hasBearing() {
                  return tracking && travelled() >= MIN_TRAVEL;
              }

              public static double travelled() {
                  return Math.hypot(latestX - originX, latestZ - originZ);
              }

              /**
               * Bearing of the eye's flight, in Minecraft yaw degrees, so it can be used
               * interchangeably with a player yaw measurement.
               */
              public static double bearingDegrees() {
                  return Math.toDegrees(Math.atan2(-(latestX - originX), latestZ - originZ));
              }

              /** Where the eye was thrown from. */
              public static double originX() {
                  return originX;
              }

              public static double originZ() {
                  return originZ;
              }

              public static void forget() {
                  trackedEntityId = -1;
                  tracking = false;
                  captured = false;
              }

              /** True once this eye's throw has been recorded, manually or on its own. */
              public static boolean isCaptured() {
                  return captured;
              }

              public static void markCaptured() {
                  captured = true;
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold
          cat > src/main/java/com/adamarmanyos/stronghold/StrongholdConfig.java <<'SFEOF'
          package com.adamarmanyos.stronghold;

          import java.io.BufferedReader;
          import java.io.BufferedWriter;
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          import net.fabricmc.loader.api.FabricLoader;

          /**
           * Tiny persisted config. Currently just HUD opacity.
           *
           * FabricLoader supplies the config directory, so this needs no Fabric API. The
           * file is a single "key=value" line per setting, written only when a value
           * actually changes.
           */
          public final class StrongholdConfig {

              private static final String FILE_NAME = "strongholdfinder.properties";

              /**
               * Minecraft's text renderer treats a colour with an alpha byte below 4 as
               * "no alpha given" and forces it fully opaque, so opacity can never go all
               * the way to invisible. 10% maps to alpha 26, comfortably above that.
               */
              public static final int MIN_OPACITY = 10;
              public static final int MAX_OPACITY = 100;
              public static final int OPACITY_STEP = 10;

              /**
               * Selectable panel scales, as percentages.
               *
               * These are a fixed list rather than free steps because Minecraft's font is
               * a bitmap: at 100% and 200% every glyph lands on whole pixels and stays
               * crisp, while awkward fractions blur the text. 50%, 75%, 125% and 150% are
               * the usable middle ground.
               */
              public static final int[] SCALE_STEPS = { 50, 75, 100, 125, 150, 200 };

              /**
               * Assumed standard deviation of one measured angle, in hundredths of a
               * degree. Stored as an integer so the config file stays simple.
               *
               * The default of 6 (0.06 deg) suits careful aiming with a mouse at low FOV.
               * Real measurements on a touch device or in a hurry run several times
               * larger; the panel's Error column shows what yours actually are, and the
               * fit warning tells you when this value is too small to explain them.
               */
              public static final int MIN_SIGMA = 2;
              public static final int MAX_SIGMA = 50;
              private static final int DEFAULT_SIGMA = 6;

              private static int sigmaHundredths = DEFAULT_SIGMA;

              /**
               * Whether the angle comes from the thrown eye's flight path or from where
               * the player is looking.
               *
               * Defaults to the crosshair, which is how Ninjabrain Bot and every external
               * calculator works: you aim at the eye and the measurement is yours. Eye
               * tracking is far more precise but takes the measuring out of your hands,
               * so it is opt-in.
               */
              private static boolean trackEyeFlight;

              private static int opacityPercent = 100;
              private static int scaleIndex = 2;
              private static boolean loaded;

              private StrongholdConfig() {
              }

              public static int opacityPercent() {
                  ensureLoaded();
                  return opacityPercent;
              }

              /** Assumed angle standard deviation, in degrees. */
              public static double angleSigma() {
                  ensureLoaded();
                  return sigmaHundredths / 100.0D;
              }

              public static int sigmaHundredths() {
                  ensureLoaded();
                  return sigmaHundredths;
              }

              public static void setSigmaHundredths(int value) {
                  ensureLoaded();
                  int updated = value;
                  if (updated < MIN_SIGMA) {
                      updated = MIN_SIGMA;
                  }
                  if (updated > MAX_SIGMA) {
                      updated = MAX_SIGMA;
                  }
                  if (updated != sigmaHundredths) {
                      sigmaHundredths = updated;
                      save();
                  }
              }

              public static boolean trackEyeFlight() {
                  ensureLoaded();
                  return trackEyeFlight;
              }

              public static void setTrackEyeFlight(boolean value) {
                  ensureLoaded();
                  if (value != trackEyeFlight) {
                      trackEyeFlight = value;
                      save();
                  }
              }

              public static int scalePercent() {
                  ensureLoaded();
                  return SCALE_STEPS[scaleIndex];
              }

              public static float scaleFactor() {
                  return scalePercent() / 100.0F;
              }

              /**
               * Steps the panel scale up or down through {@link #SCALE_STEPS}.
               *
               * @return the new scale as a percentage
               */
              public static int adjustScale(int direction) {
                  ensureLoaded();

                  int updated = scaleIndex + direction;
                  if (updated < 0) {
                      updated = 0;
                  }
                  if (updated >= SCALE_STEPS.length) {
                      updated = SCALE_STEPS.length - 1;
                  }

                  if (updated != scaleIndex) {
                      scaleIndex = updated;
                      save();
                  }
                  return SCALE_STEPS[scaleIndex];
              }

              /** Sets opacity directly, for the settings screen sliders. */
              public static void setOpacityPercent(int percent) {
                  ensureLoaded();
                  int updated = clamp(percent);
                  if (updated != opacityPercent) {
                      opacityPercent = updated;
                      save();
                  }
              }

              /** Sets scale to the nearest allowed step, for the settings screen. */
              public static void setScalePercent(int percent) {
                  ensureLoaded();
                  int updated = nearestScaleIndex(percent);
                  if (updated != scaleIndex) {
                      scaleIndex = updated;
                      save();
                  }
              }

              public static int scaleIndex() {
                  ensureLoaded();
                  return scaleIndex;
              }

              public static void setScaleIndex(int index) {
                  ensureLoaded();
                  int updated = index;
                  if (updated < 0) {
                      updated = 0;
                  }
                  if (updated >= SCALE_STEPS.length) {
                      updated = SCALE_STEPS.length - 1;
                  }
                  if (updated != scaleIndex) {
                      scaleIndex = updated;
                      save();
                  }
              }

              /** Alpha byte for the current opacity, ready to OR into an RGB colour. */
              public static int alphaBits() {
                  int alpha = (int) Math.round((opacityPercent() / 100.0D) * 255.0D);
                  if (alpha < 26) {
                      alpha = 26;
                  }
                  if (alpha > 255) {
                      alpha = 255;
                  }
                  return alpha << 24;
              }

              /** Applies the current opacity to a 0xRRGGBB colour. */
              public static int applyOpacity(int rgb) {
                  return alphaBits() | (rgb & 0x00FFFFFF);
              }

              /** @return the new opacity, clamped */
              public static int adjustOpacity(int deltaPercent) {
                  ensureLoaded();

                  int updated = opacityPercent + deltaPercent;
                  if (updated < MIN_OPACITY) {
                      updated = MIN_OPACITY;
                  }
                  if (updated > MAX_OPACITY) {
                      updated = MAX_OPACITY;
                  }

                  if (updated != opacityPercent) {
                      opacityPercent = updated;
                      save();
                  }
                  return opacityPercent;
              }

              private static synchronized void ensureLoaded() {
                  if (loaded) {
                      return;
                  }
                  loaded = true;

                  try {
                      Path path = configPath();
                      if (!Files.exists(path)) {
                          return;
                      }
                      BufferedReader reader = Files.newBufferedReader(path);
                      try {
                          String line;
                          while ((line = reader.readLine()) != null) {
                              int equals = line.indexOf('=');
                              if (equals <= 0) {
                                  continue;
                              }
                              String key = line.substring(0, equals).trim();
                              String value = line.substring(equals + 1).trim();
                              if ("opacity".equals(key)) {
                                  opacityPercent = clamp(Integer.parseInt(value));
                              } else if ("scale".equals(key)) {
                                  scaleIndex = nearestScaleIndex(Integer.parseInt(value));
                              } else if ("sigma".equals(key)) {
                                  sigmaHundredths = clampSigma(Integer.parseInt(value));
                              } else if ("trackeye".equals(key)) {
                                  trackEyeFlight = "true".equalsIgnoreCase(value);
                              }
                          }
                      } finally {
                          reader.close();
                      }
                  } catch (IOException failed) {
                      // Unreadable config is not worth crashing over; defaults stand.
                  } catch (NumberFormatException failed) {
                      opacityPercent = 100;
                      scaleIndex = 2;
                      sigmaHundredths = DEFAULT_SIGMA;
                      trackEyeFlight = false;
                  }
              }

              private static void save() {
                  try {
                      Path path = configPath();
                      Path parent = path.getParent();
                      if (parent != null) {
                          Files.createDirectories(parent);
                      }
                      BufferedWriter writer = Files.newBufferedWriter(path);
                      try {
                          writer.write("opacity=" + opacityPercent);
                          writer.newLine();
                          writer.write("scale=" + SCALE_STEPS[scaleIndex]);
                          writer.newLine();
                          writer.write("sigma=" + sigmaHundredths);
                          writer.newLine();
                          writer.write("trackeye=" + trackEyeFlight);
                          writer.newLine();
                      } finally {
                          writer.close();
                      }
                  } catch (IOException failed) {
                      // Setting still applies for this session even if it cannot persist.
                  }
              }

              /** Nearest allowed scale to a value read from disk. */
              private static int nearestScaleIndex(int percent) {
                  int best = 0;
                  int bestDistance = Integer.MAX_VALUE;
                  for (int i = 0; i < SCALE_STEPS.length; i++) {
                      int distance = Math.abs(SCALE_STEPS[i] - percent);
                      if (distance < bestDistance) {
                          bestDistance = distance;
                          best = i;
                      }
                  }
                  return best;
              }

              private static int clampSigma(int value) {
                  if (value < MIN_SIGMA) {
                      return MIN_SIGMA;
                  }
                  if (value > MAX_SIGMA) {
                      return MAX_SIGMA;
                  }
                  return value;
              }

              private static int clamp(int value) {
                  if (value < MIN_OPACITY) {
                      return MIN_OPACITY;
                  }
                  if (value > MAX_OPACITY) {
                      return MAX_OPACITY;
                  }
                  return value;
              }

              private static Path configPath() {
                  return FabricLoader.getInstance().getConfigDir().resolve(FILE_NAME);
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold
          cat > src/main/java/com/adamarmanyos/stronghold/StrongholdFinderClient.java <<'SFEOF'
          package com.adamarmanyos.stronghold;

          import net.fabricmc.api.ClientModInitializer;

          /**
           * Entrypoint. There is intentionally nothing to do here: all behaviour is
           * driven from the HUD render injection, which avoids needing Fabric API's
           * tick/keybinding events.
           */
          public class StrongholdFinderClient implements ClientModInitializer {

              @Override
              public void onInitializeClient() {
                  System.out.println("[strongholdfinder] loaded, engine: " + StrongholdOverlay.calculatorName());
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold
          cat > src/main/java/com/adamarmanyos/stronghold/StrongholdOverlay.java <<'SFEOF'
          package com.adamarmanyos.stronghold;

          import java.util.ArrayList;
          import java.util.List;

          import com.adamarmanyos.stronghold.calc.EyeMeasurement;
          import com.adamarmanyos.stronghold.calc.NinjabrainChunkCalculator;
          import com.adamarmanyos.stronghold.calc.StrongholdCalculator;
          import com.adamarmanyos.stronghold.calc.StrongholdPrediction;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.options.GameOptions;
          import net.minecraft.client.gui.DrawableHelper;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.client.util.math.MatrixStack;

          import org.lwjgl.glfw.GLFW;

          /**
           * All mod state and rendering lives here. The mixin does nothing except call
           * {@link #render(MatrixStack)} once per frame, which keeps the mixin itself
           * trivial and means a mistake in this class can never break HUD injection.
           *
           * Everything runs on the render thread, so no synchronisation is needed and no
           * GLFW call is ever made off-thread.
           *
           * The panel layout deliberately mirrors Ninjabrain Bot's window: a title bar,
           * a candidate table with Chunk / % / Dist. / Nether columns, then an eye-throw
           * table with x / z / Angle / Error. It cannot match exactly - Minecraft only
           * offers its own bitmap font, and there is no way to draw rounded corners
           * cheaply - but the structure, columns and colour language are the same.
           */
          public final class StrongholdOverlay {

              // ------------------------------------------------------------------ keys

              private static final int KEY_MODIFIER = GLFW.GLFW_KEY_F3;
              private static final int KEY_CAPTURE = GLFW.GLFW_KEY_C;
              private static final int KEY_TOGGLE = GLFW.GLFW_KEY_N;
              private static final int KEY_SETTINGS = GLFW.GLFW_KEY_PERIOD;
              private static final int KEY_MEASURE_MODE = GLFW.GLFW_KEY_M;

              // Measuring view: narrow FOV and the slowest mouse, so a pixel of movement
              // covers the least angle and the crosshair can be put exactly on the eye.
              // This is the legal substitute for a zoom mod - both are vanilla settings.
              private static final double MEASURE_FOV = 30.0D;
              private static final double MEASURE_SENSITIVITY = 0.0D;

              // Running view: Quake Pro and a fast mouse.
              //
              // mouseSensitivity is NOT the percentage the options slider shows. The
              // slider displays the field times 200, which is why vanilla's default of
              // 0.5 reads as 100%. So 80% on the slider is 0.4 here, not 0.8.
              private static final double TRAVEL_FOV = 110.0D;
              private static final double TRAVEL_SENSITIVITY = 0.4D;

              /** FOV below this counts as already being in measuring view. */
              private static final double MEASURE_FOV_THRESHOLD = 70.0D;
              private static final int KEY_RESET = GLFW.GLFW_KEY_B;
              private static final int KEY_FADE = GLFW.GLFW_KEY_LEFT_BRACKET;
              private static final int KEY_BRIGHTEN = GLFW.GLFW_KEY_RIGHT_BRACKET;
              private static final int KEY_SMALLER = GLFW.GLFW_KEY_MINUS;
              private static final int KEY_LARGER = GLFW.GLFW_KEY_EQUAL;

              // ---------------------------------------------------------------- layout

              private static final int PANEL_X = 4;
              private static final int PANEL_Y = 4;
              private static final int PANEL_WIDTH = 256;

              private static final int PADDING = 5;
              private static final int TITLE_BAR_HEIGHT = 14;
              private static final int ROW_HEIGHT = 11;

              // Column geometry, measured from the panel's left edge. Checked against
              // Minecraft's font metrics for the widest values each column can hold - a
              // far-ring stronghold at (-8944, -8944) with Nether (-1118, -1118), 100.0%
              // certainty, a five digit distance, and throw coordinates out to
              // -29999.99 - so nothing collides or spills past the panel edge.
              private static final int COL_COORD_CENTRE = 43;
              private static final int COL_PERCENT_RIGHT = 119;
              private static final int COL_DIST_RIGHT = 155;
              private static final int COL_NETHER_CENTRE = 199;

              // Eye-throw table columns.
              private static final int COL_THROW_X_RIGHT = 84;
              private static final int COL_THROW_Z_RIGHT = 146;
              private static final int COL_THROW_ANGLE_RIGHT = 198;
              private static final int COL_THROW_ERROR_RIGHT = 251;

              // ---------------------------------------------------------------- colours

              private static final int PANEL_BACKGROUND = 0x1C1F24;
              private static final int TITLE_BAR_BACKGROUND = 0x2C3138;
              private static final int SEPARATOR = 0x3A3F47;

              private static final int COLOR_TITLE = 0xF0F2F5;
              private static final int COLOR_VERSION = 0x7A828C;
              private static final int COLOR_HEADER = 0xB4BECC;
              private static final int COLOR_COORD = 0x8FA8C8;
              private static final int COLOR_NUMBER = 0xD8DCE2;
              private static final int COLOR_SECTION = 0xF0F2F5;

              private static final int COLOR_HIGH = 0x5BC46B;
              private static final int COLOR_MEDIUM = 0xE0A83C;
              private static final int COLOR_LOW = 0xC24A4A;

              private static final int COLOR_NOTICE = 0xFFD24A;
              private static final int COLOR_WARNING = 0xFF7A5A;

              /** Below this separation between throws, triangulation is badly weak. */
              private static final double MIN_USEFUL_BASELINE = 100.0D;

              /** Chi-square per measurement above which the angles clearly disagree. */
              private static final double FIT_WARNING_RATIO = 2.0D;

              // Certainty thresholds for the percentage colour, matching the reference
              // window where a strong candidate is green and near-zero ones are red.
              private static final double PERCENT_HIGH = 50.0D;
              private static final double PERCENT_MEDIUM = 5.0D;

              // Angle error thresholds in degrees, for the Error column colour.
              private static final double ERROR_GOOD = 0.01D;
              private static final double ERROR_FAIR = 0.05D;

              // ------------------------------------------------------------------ state

              private static final long NOTICE_DURATION_MS = 3000L;
              private static final int MAX_MEASUREMENTS = 3;

              private static final String VERSION = "v4.4.0";

              private static final StrongholdCalculator CALCULATOR = new NinjabrainChunkCalculator();

              private static final List<EyeMeasurement> MEASUREMENTS = new ArrayList<EyeMeasurement>();

              private static List<StrongholdPrediction> results;
              private static String advice;

              private static boolean hidden;

              private static String notice;
              private static long noticeExpiresAt;

              // Previous key states, for rising-edge detection.
              private static boolean prevCapture;
              private static boolean prevToggle;
              private static boolean prevSettings;
              private static boolean prevMeasureMode;
              private static boolean prevReset;
              private static boolean prevFade;
              private static boolean prevBrighten;
              private static boolean prevSmaller;
              private static boolean prevLarger;

              private StrongholdOverlay() {
              }

              public static void render(MatrixStack matrices) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client == null || client.player == null) {
                      return;
                  }

                  EyeTracker.tick(client);
                  pollKeys(client);

                  float scale = StrongholdConfig.scaleFactor();
                  if (scale == 1.0F) {
                      draw(client, matrices);
                      return;
                  }

                  // Scaling the matrix scales the anchor too, so everything grows out of
                  // the top-left corner and the panel stays put.
                  matrices.push();
                  matrices.scale(scale, scale, 1.0F);
                  try {
                      draw(client, matrices);
                  } finally {
                      matrices.pop();
                  }
              }

              // ----------------------------------------------------------------- input

              /**
               * Polls the raw key state each frame rather than hooking Minecraft's own
               * key handling. This is deliberate: F3+C is a vanilla debug combination
               * (copy position as a /tp command), and intercepting or cancelling it would
               * risk breaking that behaviour. Reading the key state alongside vanilla
               * leaves the vanilla action completely untouched.
               *
               * Note that holding F3+C down for several seconds is a vanilla "manual
               * crash" shortcut. Tap it; do not hold it.
               */
              private static void pollKeys(MinecraftClient client) {
                  if (client.currentScreen != null) {
                      // A screen is open (chat, inventory, menus). Ignore keys so typing
                      // letters in chat cannot trigger the mod.
                      prevCapture = false;
                      prevToggle = false;
                      prevSettings = false;
                      prevMeasureMode = false;
                      prevReset = false;
                      prevFade = false;
                      prevBrighten = false;
                      prevSmaller = false;
                      prevLarger = false;
                      return;
                  }

                  long window = client.getWindow().getHandle();

                  boolean modifier = InputUtil.isKeyPressed(window, KEY_MODIFIER);
                  boolean capture = modifier && InputUtil.isKeyPressed(window, KEY_CAPTURE);
                  boolean toggle = !modifier && InputUtil.isKeyPressed(window, KEY_TOGGLE);
                  boolean settings = !modifier && InputUtil.isKeyPressed(window, KEY_SETTINGS);
                  boolean measureMode = !modifier && InputUtil.isKeyPressed(window, KEY_MEASURE_MODE);
                  boolean reset = !modifier && InputUtil.isKeyPressed(window, KEY_RESET);
                  boolean fade = !modifier && InputUtil.isKeyPressed(window, KEY_FADE);
                  boolean brighten = !modifier && InputUtil.isKeyPressed(window, KEY_BRIGHTEN);
                  boolean smaller = !modifier && InputUtil.isKeyPressed(window, KEY_SMALLER);
                  boolean larger = !modifier && InputUtil.isKeyPressed(window, KEY_LARGER);

                  if (capture && !prevCapture) {
                      capture(client.player);
                  }
                  if (toggle && !prevToggle) {
                      // Hides the panel without discarding anything; press again to bring
                      // the same result back. Use B to actually clear the measurements.
                      hidden = !hidden;
                      showNotice(hidden ? "Panel hidden" : "Panel shown");
                  }
                  if (settings && !prevSettings) {
                      client.openScreen(new StrongholdSettingsScreen());
                  }
                  if (measureMode && !prevMeasureMode) {
                      toggleMeasureMode(client);
                  }
                  if (reset && !prevReset) {
                      reset();
                  }
                  if (fade && !prevFade) {
                      showNotice("Opacity " + StrongholdConfig.adjustOpacity(-StrongholdConfig.OPACITY_STEP) + "%");
                  }
                  if (brighten && !prevBrighten) {
                      showNotice("Opacity " + StrongholdConfig.adjustOpacity(StrongholdConfig.OPACITY_STEP) + "%");
                  }

                  if (smaller && !prevSmaller) {
                      showNotice("Size " + StrongholdConfig.adjustScale(-1) + "%");
                  }
                  if (larger && !prevLarger) {
                      showNotice("Size " + StrongholdConfig.adjustScale(1) + "%");
                  }

                  prevCapture = capture;
                  prevToggle = toggle;
                  prevSettings = settings;
                  prevMeasureMode = measureMode;
                  prevReset = reset;
                  prevFade = fade;
                  prevBrighten = brighten;
                  prevSmaller = smaller;
                  prevLarger = larger;
              }

              /**
               * Swaps between a measuring view and a running view.
               *
               * Zoom mods are not legal for leaderboard runs, but FOV and mouse
               * sensitivity are ordinary vanilla settings. Dropping to FOV 30 with the
               * slowest mouse makes each pixel of movement cover a much smaller angle,
               * which is the whole benefit a zoom would have given while measuring.
               *
               * Which way it swaps is decided by the current FOV rather than a remembered
               * flag, so changing FOV through the options menu cannot leave the toggle
               * out of step with what is on screen.
               */
              private static void toggleMeasureMode(MinecraftClient client) {
                  GameOptions options = client.options;
                  if (options == null) {
                      return;
                  }

                  boolean measuring = options.fov <= MEASURE_FOV_THRESHOLD;

                  if (measuring) {
                      options.fov = TRAVEL_FOV;
                      options.mouseSensitivity = TRAVEL_SENSITIVITY;
                      showNotice("Travel: FOV 110, sens 80%");
                  } else {
                      options.fov = MEASURE_FOV;
                      options.mouseSensitivity = MEASURE_SENSITIVITY;
                      showNotice("Measure: FOV 30, sens 0%");
                  }

                  // Persist, so the setting survives a restart like any options change.
                  options.write();
              }

              // ----------------------------------------------------------------- state

              private static void capture(ClientPlayerEntity player) {
                  boolean useTracking = StrongholdConfig.trackEyeFlight();

                  if (useTracking && EyeTracker.hasBearing() && EyeTracker.isCaptured()) {
                      // This throw has already been added; pressing the key again must
                      // not add the same eye twice.
                      showNotice("That eye is already added");
                      return;
                  }

                  EyeMeasurement measurement;

                  if (useTracking && EyeTracker.hasBearing()) {
                      // Bearing taken from the eye's own flight path: no aiming involved,
                      // so no aiming error. This is the accurate path.
                      measurement = new EyeMeasurement(
                          EyeTracker.originX(),
                          EyeTracker.originZ(),
                          (float) EyeTracker.bearingDegrees(),
                          EyeTracker.TRACKED_SIGMA,
                          true);
                  } else {
                      // No eye in flight, or it has not travelled far enough yet. Fall
                      // back to where the player is looking, which is what an external
                      // calculator has to use. In 1.16.1 yaw is a public field on Entity;
                      // there is no getYaw() accessor on this version.
                      measurement = new EyeMeasurement(
                          player.getX(),
                          player.getZ(),
                          player.yaw,
                          StrongholdConfig.angleSigma(),
                          false);
                  }

                  // Read the flight distance before marking the eye done, not after.
                  String detail = measurement.fromEyeFlight
                      ? (" tracked over " + decimals(EyeTracker.travelled(), 0) + " blocks")
                      : " from crosshair - less accurate";

                  EyeTracker.markCaptured();
                  record(measurement, detail);
              }

              private static void record(EyeMeasurement measurement, String detail) {
                  MEASUREMENTS.add(measurement);
                  hidden = false;

                  showNotice("Eye " + MEASUREMENTS.size() + detail);

                  while (MEASUREMENTS.size() > MAX_MEASUREMENTS) {
                      // Third and later measurements replace the oldest one.
                      MEASUREMENTS.remove(0);
                  }

                  // Recalculate automatically, the way the reference tool updates as soon
                  // as it has enough throws. One throw is enough for a rough answer; the
                  // panel's own certainty and +/- figures say how rough.
                  calculate();
              }

              private static void calculate() {
                  if (MEASUREMENTS.size() < CALCULATOR.minimumMeasurements()) {
                      showNotice("Need an Eye measurement");
                      return;
                  }

                  StrongholdCalculator.Result calculated = CALCULATOR.calculate(MEASUREMENTS);
                  if (!calculated.isSuccess()) {
                      results = null;
                      advice = null;
                      showNotice(calculated.error());
                      return;
                  }

                  results = calculated.candidates();
                  advice = calculated.advice;
                  notice = null;
              }

              private static void reset() {
                  MEASUREMENTS.clear();
                  results = null;
                  advice = null;
                  notice = null;
                  hidden = false;
                  EyeTracker.forget();
              }

              private static void showNotice(String text) {
                  notice = text;
                  noticeExpiresAt = System.currentTimeMillis() + NOTICE_DURATION_MS;
              }

              // --------------------------------------------------------------- drawing

              private static void draw(MinecraftClient client, MatrixStack matrices) {
                  boolean hasContent = !hidden
                      && (!MEASUREMENTS.isEmpty()
                          || (StrongholdConfig.trackEyeFlight() && EyeTracker.isReady())
                          || (results != null && !results.isEmpty()));

                  if (hasContent) {
                      drawPanel(client, matrices);
                  }

                  if (notice != null) {
                      if (System.currentTimeMillis() > noticeExpiresAt) {
                          notice = null;
                      } else {
                          int y = hasContent ? (PANEL_Y + panelHeight() + 4) : PANEL_Y;
                          text(client, matrices, notice, PANEL_X + PADDING, y, COLOR_NOTICE);
                      }
                  }
              }

              private static int candidateRows() {
                  return results == null ? 0 : results.size();
              }

              private static int panelHeight() {
                  int height = TITLE_BAR_HEIGHT;

                  if (candidateRows() > 0) {
                      height += 3;
                      height += ROW_HEIGHT;                       // column headers
                      height += candidateRows() * ROW_HEIGHT;     // candidates
                      height += 4;
                  }

                  height += 1;                                    // separator
                  height += 3;
                  height += ROW_HEIGHT;                           // "Ender eye throws"
                  height += ROW_HEIGHT;                           // column headers
                  height += MEASUREMENTS.size() * ROW_HEIGHT;
                  if (advice != null && MEASUREMENTS.size() < 2) {
                      height += ROW_HEIGHT + 2;
                  }
                  if (StrongholdConfig.trackEyeFlight() && EyeTracker.isReady()) {
                      height += ROW_HEIGHT + 2;
                  }
                  if (warning() != null) {
                      height += ROW_HEIGHT + 2;
                  }
                  height += PADDING;

                  return height;
              }

              private static void drawPanel(MinecraftClient client, MatrixStack matrices) {
                  int left = PANEL_X;
                  int top = PANEL_Y;
                  int right = left + PANEL_WIDTH;
                  int bottom = top + panelHeight();

                  roundedRect(matrices, left, top, right, bottom, PANEL_BACKGROUND);
                  roundedTop(matrices, left, top, right, top + TITLE_BAR_HEIGHT, TITLE_BAR_BACKGROUND);

                  int y = top + 3;

                  text(client, matrices, "Stronghold Finder", left + PADDING, y, COLOR_TITLE);
                  int titleWidth = client.textRenderer.getWidth("Stronghold Finder");
                  text(client, matrices, VERSION, left + PADDING + titleWidth + 4, y, COLOR_VERSION);

                  y = top + TITLE_BAR_HEIGHT;

                  if (candidateRows() > 0) {
                      y += 3;

                      centred(client, matrices, "Overworld", left + COL_COORD_CENTRE, y, COLOR_HEADER);
                      rightAligned(client, matrices, "%", left + COL_PERCENT_RIGHT, y, COLOR_HEADER);
                      rightAligned(client, matrices, "Dist.", left + COL_DIST_RIGHT, y, COLOR_HEADER);
                      centred(client, matrices, "Nether", left + COL_NETHER_CENTRE, y, COLOR_HEADER);
                      y += ROW_HEIGHT;

                      for (int i = 0; i < results.size(); i++) {
                          StrongholdPrediction candidate = results.get(i);

                          // Block coordinates, not chunk coordinates: this is the place
                          // to walk to, so it should be the number the F3 screen shows.
                          String overworld = "(" + candidate.overworldX
                              + ", " + candidate.overworldZ + ")";
                          String nether = "(" + candidate.netherX() + ", " + candidate.netherZ() + ")";

                          double dx = candidate.overworldX - client.player.getX();
                          double dz = candidate.overworldZ - client.player.getZ();
                          long distance = Math.round(Math.sqrt((dx * dx) + (dz * dz)));

                          centred(client, matrices, overworld, left + COL_COORD_CENTRE, y, COLOR_COORD);

                          if (candidate.hasCertainty()) {
                              double percent = candidate.certainty * 100.0D;
                              rightAligned(client, matrices, decimals(percent, 1) + "%",
                                  left + COL_PERCENT_RIGHT, y, percentColor(percent));
                          } else {
                              rightAligned(client, matrices, "-", left + COL_PERCENT_RIGHT, y, COLOR_NUMBER);
                          }

                          rightAligned(client, matrices, Long.toString(distance),
                              left + COL_DIST_RIGHT, y, COLOR_NUMBER);
                          centred(client, matrices, nether, left + COL_NETHER_CENTRE, y, COLOR_COORD);

                          y += ROW_HEIGHT;
                      }

                      y += 4;
                  }

                  fill(matrices, left + PADDING, y, right - PADDING, y + 1, SEPARATOR);
                  y += 1 + 3;

                  text(client, matrices, "Ender eye throws", left + PADDING, y, COLOR_SECTION);
                  y += ROW_HEIGHT;

                  text(client, matrices, "Src", left + PADDING, y, COLOR_HEADER);
                  rightAligned(client, matrices, "x", left + COL_THROW_X_RIGHT, y, COLOR_HEADER);
                  rightAligned(client, matrices, "z", left + COL_THROW_Z_RIGHT, y, COLOR_HEADER);
                  rightAligned(client, matrices, "Angle", left + COL_THROW_ANGLE_RIGHT, y, COLOR_HEADER);
                  rightAligned(client, matrices, "Error", left + COL_THROW_ERROR_RIGHT, y, COLOR_HEADER);
                  y += ROW_HEIGHT;

                  StrongholdPrediction best = (results == null || results.isEmpty()) ? null : results.get(0);

                  for (int i = 0; i < MEASUREMENTS.size(); i++) {
                      EyeMeasurement measurement = MEASUREMENTS.get(i);

                      // Which way this angle was obtained. A silent fallback to the
                      // crosshair is the difference between hitting the chunk and missing
                      // by tens of blocks, so it is never left implicit.
                      text(client, matrices, measurement.fromEyeFlight ? "eye" : "aim",
                          left + PADDING, y,
                          measurement.fromEyeFlight ? COLOR_HIGH : COLOR_LOW);

                      rightAligned(client, matrices, decimals(measurement.x, 2),
                          left + COL_THROW_X_RIGHT, y, COLOR_COORD);
                      rightAligned(client, matrices, decimals(measurement.z, 2),
                          left + COL_THROW_Z_RIGHT, y, COLOR_COORD);
                      rightAligned(client, matrices, decimals(measurement.yaw, 2),
                          left + COL_THROW_ANGLE_RIGHT, y,
                          measurement.fromEyeFlight ? COLOR_HIGH : COLOR_NUMBER);

                      if (best == null) {
                          rightAligned(client, matrices, "-", left + COL_THROW_ERROR_RIGHT, y, COLOR_NUMBER);
                      } else {
                          // How far this measured angle sits from the angle to the top
                          // candidate, assuming that candidate is correct.
                          double error = angleError(measurement, best);
                          rightAligned(client, matrices, decimals(error, 3),
                              left + COL_THROW_ERROR_RIGHT, y, errorColor(error));
                      }

                      y += ROW_HEIGHT;
                  }

                  if (advice != null && MEASUREMENTS.size() < 2) {
                      y += 2;
                      text(client, matrices, advice, left + PADDING, y, COLOR_HEADER);
                      y += ROW_HEIGHT;
                  }

                  if (StrongholdConfig.trackEyeFlight() && EyeTracker.isReady()) {
                      y += 2;
                      text(client, matrices,
                          "Eye tracked " + decimals(EyeTracker.travelled(), 0) + " blocks - F3+C to add",
                          left + PADDING, y, COLOR_HIGH);
                      y += ROW_HEIGHT;
                  }

                  String warning = warning();
                  if (warning != null) {
                      y += 2;
                      text(client, matrices, warning, left + PADDING, y, COLOR_WARNING);
                  }
              }

              /**
               * The single most useful complaint about the current measurements, or null.
               *
               * Certainty answers "which candidate", not "are the measurements any good",
               * so a tight but wrong answer can still read 100%. These two checks catch
               * the cases that produce one.
               */
              private static String warning() {
                  if (MEASUREMENTS.size() < 2 || results == null || results.isEmpty()) {
                      return null;
                  }

                  // The widest separation, not the narrowest. What matters is whether any
                  // pair of throws gives good geometry; a third throw taken near the
                  // first does not undo a good long baseline between the other two.
                  double baseline = longestBaseline();
                  if (baseline < MIN_USEFUL_BASELINE) {
                      return "Throws " + Math.round(baseline) + " blocks apart - move further";
                  }

                  StrongholdPrediction best = results.get(0);
                  double worst = 0.0D;
                  double chiSquare = 0.0D;
                  for (int i = 0; i < MEASUREMENTS.size(); i++) {
                      double error = angleError(MEASUREMENTS.get(i), best);
                      double scaled = error / MEASUREMENTS.get(i).sigma;
                      chiSquare += scaled * scaled;
                      if (Math.abs(error) > worst) {
                          worst = Math.abs(error);
                      }
                  }

                  if (chiSquare > (FIT_WARNING_RATIO * MEASUREMENTS.size())) {
                      return "Angles off by " + decimals(worst, 2) + " deg - retake";
                  }
                  return null;
              }

              /** Widest separation between any two throws - the best geometry available. */
              private static double longestBaseline() {
                  double longest = 0.0D;
                  for (int i = 0; i < MEASUREMENTS.size(); i++) {
                      for (int j = i + 1; j < MEASUREMENTS.size(); j++) {
                          EyeMeasurement a = MEASUREMENTS.get(i);
                          EyeMeasurement b = MEASUREMENTS.get(j);
                          double distance = Math.hypot(a.x - b.x, a.z - b.z);
                          if (distance > longest) {
                              longest = distance;
                          }
                      }
                  }
                  return longest;
              }

              /** Residual in degrees between a measured angle and the predicted target. */
              private static double angleError(EyeMeasurement measurement, StrongholdPrediction prediction) {
                  double predicted = Math.toDegrees(Math.atan2(
                      -(prediction.overworldX - measurement.x),
                      prediction.overworldZ - measurement.z));

                  double difference = (predicted - measurement.yaw + 180.0D) % 360.0D;
                  if (difference < 0.0D) {
                      difference += 360.0D;
                  }
                  return difference - 180.0D;
              }

              private static int percentColor(double percent) {
                  if (percent >= PERCENT_HIGH) {
                      return COLOR_HIGH;
                  }
                  if (percent >= PERCENT_MEDIUM) {
                      return COLOR_MEDIUM;
                  }
                  return COLOR_LOW;
              }

              private static int errorColor(double error) {
                  double magnitude = Math.abs(error);
                  if (magnitude <= ERROR_GOOD) {
                      return COLOR_HIGH;
                  }
                  if (magnitude <= ERROR_FAIR) {
                      return COLOR_MEDIUM;
                  }
                  return COLOR_LOW;
              }

              // ------------------------------------------------------------- utilities

              private static void fill(MatrixStack matrices, int x1, int y1, int x2, int y2, int rgb) {
                  DrawableHelper.fill(matrices, x1, y1, x2, y2, StrongholdConfig.applyOpacity(rgb));
              }

              /**
               * A rectangle with 3px rounded corners, drawn as five stacked bands.
               *
               * The bands must not overlap. Filling overlapping rectangles would blend
               * the same translucent colour over itself, so at reduced opacity the middle
               * of the panel would come out visibly darker than its edges.
               */
              private static void roundedRect(MatrixStack matrices, int left, int top,
                                              int right, int bottom, int rgb) {
                  fill(matrices, left + 3, top, right - 3, top + 1, rgb);
                  fill(matrices, left + 1, top + 1, right - 1, top + 3, rgb);
                  fill(matrices, left, top + 3, right, bottom - 3, rgb);
                  fill(matrices, left + 1, bottom - 3, right - 1, bottom - 1, rgb);
                  fill(matrices, left + 3, bottom - 1, right - 3, bottom, rgb);
              }

              /** Rounded at the top corners, square at the bottom, for the title bar. */
              private static void roundedTop(MatrixStack matrices, int left, int top,
                                             int right, int bottom, int rgb) {
                  fill(matrices, left + 3, top, right - 3, top + 1, rgb);
                  fill(matrices, left + 1, top + 1, right - 1, top + 3, rgb);
                  fill(matrices, left, top + 3, right, bottom, rgb);
              }

              /** Flat text, no drop shadow: the panel reads as a UI rather than a HUD. */
              private static void text(MinecraftClient client, MatrixStack matrices,
                                       String value, int x, int y, int rgb) {
                  client.textRenderer.draw(matrices, value, x, y, StrongholdConfig.applyOpacity(rgb));
              }

              private static void centred(MinecraftClient client, MatrixStack matrices,
                                          String value, int centreX, int y, int rgb) {
                  int width = client.textRenderer.getWidth(value);
                  text(client, matrices, value, centreX - (width / 2), y, rgb);
              }

              private static void rightAligned(MinecraftClient client, MatrixStack matrices,
                                               String value, int rightX, int y, int rgb) {
                  int width = client.textRenderer.getWidth(value);
                  text(client, matrices, value, rightX - width, y, rgb);
              }

              /**
               * Fixed decimal places without String.format, which drags in locale
               * handling and would print commas for some players.
               */
              private static String decimals(double value, int places) {
                  long scale = 1L;
                  for (int i = 0; i < places; i++) {
                      scale *= 10L;
                  }

                  long scaled = Math.round(value * scale);
                  boolean negative = scaled < 0L;
                  if (negative) {
                      scaled = -scaled;
                  }

                  String fraction = Long.toString(scaled % scale);
                  while (fraction.length() < places) {
                      fraction = "0" + fraction;
                  }

                  String text = (scaled / scale) + "." + fraction;
                  return negative ? ("-" + text) : text;
              }

              public static String calculatorName() {
                  return CALCULATOR.name();
              }
          }
          SFEOF
          mkdir -p src/main/java/com/adamarmanyos/stronghold
          cat > src/main/java/com/adamarmanyos/stronghold/StrongholdSettingsScreen.java <<'SFEOF'
          package com.adamarmanyos.stronghold;

          import net.minecraft.client.gui.DrawableHelper;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.util.math.MatrixStack;
          import net.minecraft.text.LiteralText;

          /**
           * Settings screen with sliders for panel size and opacity.
           *
           * The sliders are drawn and handled by hand rather than using Minecraft's
           * SliderWidget. That class gained a Text parameter in its constructor in 1.17
           * and was renamed from AbstractButtonWidget to ClickableWidget at the same
           * time, so building against it means guessing at the exact 1.16.1 signature.
           * Everything used here - Screen's constructor, render, mouse callbacks, and
           * DrawableHelper.fill - is stable across those versions. Text centring is done
           * by measuring the string rather than calling drawCenteredString, which is an
           * instance method in 1.16.1 and static in later versions.
           */
          public class StrongholdSettingsScreen extends Screen {

              private static final int PANEL_WIDTH = 220;
              private static final int PANEL_HEIGHT = 186;

              private static final int SLIDER_WIDTH = 180;
              private static final int SLIDER_HEIGHT = 16;
              private static final int KNOB_WIDTH = 8;

              private static final int BACKGROUND = 0xE81C1F24;
              private static final int BORDER = 0xFF3A3F47;
              private static final int TITLE_BAR = 0xFF2C3138;

              private static final int TRACK = 0xFF14171B;
              private static final int TRACK_FILL = 0xFF3C5A80;
              private static final int KNOB = 0xFFB4BECC;
              private static final int KNOB_ACTIVE = 0xFFE8ECF0;

              private static final int TEXT = 0xFFF0F2F5;
              private static final int TEXT_DIM = 0xFF8A929C;

              private int panelLeft;
              private int panelTop;

              private int sizeSliderY;
              private int opacitySliderY;
              private int sigmaSliderY;
              private int toggleY;

              /** Which slider the mouse is currently dragging, or -1. */
              private int dragging = -1;

              public StrongholdSettingsScreen() {
                  super(new LiteralText("Stronghold Finder Settings"));
              }

              @Override
              protected void init() {
                  this.panelLeft = (this.width - PANEL_WIDTH) / 2;
                  this.panelTop = (this.height - PANEL_HEIGHT) / 2;

                  this.sizeSliderY = this.panelTop + 38;
                  this.opacitySliderY = this.panelTop + 74;
                  this.sigmaSliderY = this.panelTop + 110;
                  this.toggleY = this.panelTop + 140;
              }

              /** Keeps the world rendering behind the screen instead of pausing. */
              @Override
              public boolean isPauseScreen() {
                  return false;
              }

              @Override
              public void render(MatrixStack matrices, int mouseX, int mouseY, float delta) {
                  this.renderBackground(matrices);

                  int left = this.panelLeft;
                  int top = this.panelTop;
                  int right = left + PANEL_WIDTH;
                  int bottom = top + PANEL_HEIGHT;

                  // Rounded corners as non-overlapping bands. Overlapping fills would
                  // blend the translucent background over itself and make the middle of
                  // the panel darker than its edges.
                  roundedRect(matrices, left, top, right, bottom, BORDER);
                  roundedRect(matrices, left + 1, top + 1, right - 1, bottom - 1, BACKGROUND);
                  roundedTop(matrices, left + 1, top + 1, right - 1, top + 20, TITLE_BAR);

                  centeredText(matrices, "Stronghold Finder", left + (PANEL_WIDTH / 2), top + 7, TEXT);

                  drawSlider(matrices, "Size", StrongholdConfig.scalePercent() + "%",
                      sizeFraction(), this.sizeSliderY, this.dragging == 0);

                  drawSlider(matrices, "Opacity", StrongholdConfig.opacityPercent() + "%",
                      opacityFraction(), this.opacitySliderY, this.dragging == 1);

                  drawSlider(matrices, "Aim error", sigmaText(),
                      sigmaFraction(), this.sigmaSliderY, this.dragging == 2);

                  drawToggle(matrices, "Measure from",
                      StrongholdConfig.trackEyeFlight() ? "eye flight" : "my crosshair",
                      this.toggleY);

                  centeredText(matrices, "Esc to close", left + (PANEL_WIDTH / 2), bottom - 14, TEXT_DIM);

                  super.render(matrices, mouseX, mouseY, delta);
              }

              private static void roundedRect(MatrixStack matrices, int left, int top,
                                              int right, int bottom, int color) {
                  DrawableHelper.fill(matrices, left + 3, top, right - 3, top + 1, color);
                  DrawableHelper.fill(matrices, left + 1, top + 1, right - 1, top + 3, color);
                  DrawableHelper.fill(matrices, left, top + 3, right, bottom - 3, color);
                  DrawableHelper.fill(matrices, left + 1, bottom - 3, right - 1, bottom - 1, color);
                  DrawableHelper.fill(matrices, left + 3, bottom - 1, right - 3, bottom, color);
              }

              private static void roundedTop(MatrixStack matrices, int left, int top,
                                             int right, int bottom, int color) {
                  DrawableHelper.fill(matrices, left + 3, top, right - 3, top + 1, color);
                  DrawableHelper.fill(matrices, left + 1, top + 1, right - 1, top + 3, color);
                  DrawableHelper.fill(matrices, left, top + 3, right, bottom, color);
              }

              /**
               * Centred text drawn directly through the TextRenderer.
               *
               * DrawableHelper.drawCenteredString is an instance method in 1.16.1 (it
               * only became static in a later version), so calling it as a static would
               * not compile. Measuring the string and drawing it here avoids depending on
               * which form this version happens to use.
               */
              private void centeredText(MatrixStack matrices, String value, int centreX, int y, int color) {
                  int width = this.textRenderer.getWidth(value);
                  this.textRenderer.draw(matrices, value, centreX - (width / 2.0F), y, color);
              }

              /** A two-state row: label on the left, current choice in a box on the right. */
              private void drawToggle(MatrixStack matrices, String label, String value, int y) {
                  int left = this.panelLeft + ((PANEL_WIDTH - SLIDER_WIDTH) / 2);

                  this.textRenderer.draw(matrices, label, left, y + 4, TEXT);

                  int boxWidth = 96;
                  int boxLeft = left + SLIDER_WIDTH - boxWidth;
                  DrawableHelper.fill(matrices, boxLeft, y, boxLeft + boxWidth, y + SLIDER_HEIGHT, TRACK);

                  int width = this.textRenderer.getWidth(value);
                  this.textRenderer.draw(matrices, value,
                      boxLeft + ((boxWidth - width) / 2.0F), y + 4, TEXT);
              }

              private void drawSlider(MatrixStack matrices, String label, String value,
                                      double fraction, int y, boolean active) {
                  int left = this.panelLeft + ((PANEL_WIDTH - SLIDER_WIDTH) / 2);

                  this.textRenderer.draw(matrices, label, left, y - 11, TEXT);
                  int valueWidth = this.textRenderer.getWidth(value);
                  this.textRenderer.draw(matrices, value, left + SLIDER_WIDTH - valueWidth, y - 11, TEXT_DIM);

                  DrawableHelper.fill(matrices, left, y, left + SLIDER_WIDTH, y + SLIDER_HEIGHT, TRACK);

                  int fillWidth = (int) Math.round(fraction * (SLIDER_WIDTH - KNOB_WIDTH));
                  DrawableHelper.fill(matrices, left, y, left + fillWidth + (KNOB_WIDTH / 2),
                      y + SLIDER_HEIGHT, TRACK_FILL);

                  int knobLeft = left + fillWidth;
                  DrawableHelper.fill(matrices, knobLeft, y - 1, knobLeft + KNOB_WIDTH,
                      y + SLIDER_HEIGHT + 1, active ? KNOB_ACTIVE : KNOB);
              }

              // --------------------------------------------------------------- values

              private double sizeFraction() {
                  int steps = StrongholdConfig.SCALE_STEPS.length - 1;
                  return steps <= 0 ? 0.0D : (StrongholdConfig.scaleIndex() / (double) steps);
              }

              private double opacityFraction() {
                  double span = StrongholdConfig.MAX_OPACITY - StrongholdConfig.MIN_OPACITY;
                  return (StrongholdConfig.opacityPercent() - StrongholdConfig.MIN_OPACITY) / span;
              }

              /** Sigma shown in degrees, e.g. "0.06 deg". */
              private String sigmaText() {
                  int hundredths = StrongholdConfig.sigmaHundredths();
                  String fraction = hundredths < 10 ? ("0" + hundredths) : Integer.toString(hundredths);
                  return "0." + fraction + " deg";
              }

              private double sigmaFraction() {
                  double span = StrongholdConfig.MAX_SIGMA - StrongholdConfig.MIN_SIGMA;
                  return (StrongholdConfig.sigmaHundredths() - StrongholdConfig.MIN_SIGMA) / span;
              }

              private void applySigma(double fraction) {
                  double span = StrongholdConfig.MAX_SIGMA - StrongholdConfig.MIN_SIGMA;
                  StrongholdConfig.setSigmaHundredths(
                      (int) Math.round(StrongholdConfig.MIN_SIGMA + (fraction * span)));
              }

              private void applySize(double fraction) {
                  int steps = StrongholdConfig.SCALE_STEPS.length - 1;
                  StrongholdConfig.setScaleIndex((int) Math.round(fraction * steps));
              }

              private void applyOpacity(double fraction) {
                  double span = StrongholdConfig.MAX_OPACITY - StrongholdConfig.MIN_OPACITY;
                  StrongholdConfig.setOpacityPercent(
                      (int) Math.round(StrongholdConfig.MIN_OPACITY + (fraction * span)));
              }

              // ---------------------------------------------------------------- input

              /** @return which slider row the point is on, or -1 */
              private int sliderAt(double mouseX, double mouseY) {
                  int left = this.panelLeft + ((PANEL_WIDTH - SLIDER_WIDTH) / 2);
                  if (mouseX < left - KNOB_WIDTH || mouseX > left + SLIDER_WIDTH + KNOB_WIDTH) {
                      return -1;
                  }
                  if (mouseY >= this.sizeSliderY - 2 && mouseY <= this.sizeSliderY + SLIDER_HEIGHT + 2) {
                      return 0;
                  }
                  if (mouseY >= this.opacitySliderY - 2 && mouseY <= this.opacitySliderY + SLIDER_HEIGHT + 2) {
                      return 1;
                  }
                  if (mouseY >= this.sigmaSliderY - 2 && mouseY <= this.sigmaSliderY + SLIDER_HEIGHT + 2) {
                      return 2;
                  }
                  return -1;
              }

              private double fractionAt(double mouseX) {
                  int left = this.panelLeft + ((PANEL_WIDTH - SLIDER_WIDTH) / 2);
                  double fraction = (mouseX - left - (KNOB_WIDTH / 2.0D)) / (SLIDER_WIDTH - KNOB_WIDTH);
                  if (fraction < 0.0D) {
                      return 0.0D;
                  }
                  if (fraction > 1.0D) {
                      return 1.0D;
                  }
                  return fraction;
              }

              private boolean isOnToggle(double mouseX, double mouseY) {
                  int left = this.panelLeft + ((PANEL_WIDTH - SLIDER_WIDTH) / 2);
                  return mouseX >= left && mouseX <= left + SLIDER_WIDTH
                      && mouseY >= this.toggleY && mouseY <= this.toggleY + SLIDER_HEIGHT;
              }

              @Override
              public boolean mouseClicked(double mouseX, double mouseY, int button) {
                  if (isOnToggle(mouseX, mouseY)) {
                      StrongholdConfig.setTrackEyeFlight(!StrongholdConfig.trackEyeFlight());
                      return true;
                  }

                  int slider = sliderAt(mouseX, mouseY);
                  if (slider >= 0) {
                      this.dragging = slider;
                      apply(slider, fractionAt(mouseX));
                      return true;
                  }
                  return super.mouseClicked(mouseX, mouseY, button);
              }

              @Override
              public boolean mouseDragged(double mouseX, double mouseY, int button,
                                          double deltaX, double deltaY) {
                  if (this.dragging >= 0) {
                      apply(this.dragging, fractionAt(mouseX));
                      return true;
                  }
                  return super.mouseDragged(mouseX, mouseY, button, deltaX, deltaY);
              }

              @Override
              public boolean mouseReleased(double mouseX, double mouseY, int button) {
                  this.dragging = -1;
                  return super.mouseReleased(mouseX, mouseY, button);
              }

              private void apply(int slider, double fraction) {
                  if (slider == 0) {
                      applySize(fraction);
                  } else if (slider == 1) {
                      applyOpacity(fraction);
                  } else {
                      applySigma(fraction);
                  }
              }
          }
